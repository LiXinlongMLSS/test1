<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>萤 · 白鲸塔</title>
<style>
:root{
  --bg:#08090d;
  --panel:#11141b;
  --panel2:#171b24;
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.18);
  --ink:#d9d6d0;
  --dim:#767c88;
  --blood:#b3272b;
  --blood2:#e0474c;
  --jade:#4fb3a5;
  --gold:#c9a227;
  --purple:#8e6bb0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 700px at 70% -10%, #1a2233 0%, transparent 60%),
    radial-gradient(800px 600px at 0% 110%, #2a1220 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","Source Han Serif SC",Georgia,serif;
  font-size:18px;
  line-height:2;
  letter-spacing:.02em;
  min-height:100%;
  overflow-x:hidden;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.035'/></svg>");
}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px;display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:rgba(179,39,43,.18)}
button,.choice,.pick,.wbtn,.rm{touch-action:manipulation}

/* ---------- 手机 / 窄屏 ---------- */
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;gap:16px}
  aside{position:static;padding-top:0}
  .card{margin-bottom:12px}
}
@media(max-width:760px){
  body{font-size:16.5px;line-height:1.9}
  .wrap{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  header{margin-bottom:14px;padding-top:env(safe-area-inset-top)}
  .hud{padding:9px 14px;gap:5px 13px;font-size:11.5px}
  .brand{font-size:12.5px;letter-spacing:.2em}
  .hud .it{gap:5px}
  .bar{width:50px;height:5px}
  .hud button{font-size:12px;padding:7px 11px;min-height:34px}
  main{padding-bottom:28px}
  .chapter{margin:20px 0 10px;font-size:11px;letter-spacing:.26em}
  .prose p{margin-bottom:16px}
  .choices{gap:9px;margin-top:22px}
  .choice{font-size:16px;line-height:1.6;padding:14px 14px 14px 17px;min-height:50px}
  .choice .hint{font-size:11.5px;margin-top:6px}
  .choice:hover{transform:none}
  .death{padding:20px 17px}
  .death::before{font-size:86px;top:-14px;right:-6px}
  .death h2{font-size:19px}
  .death .tagline{font-size:12px;margin-bottom:16px;padding-bottom:12px}
  .death .prose p{font-size:16.5px;line-height:1.95;margin-bottom:15px}
  .autopsy{padding:15px 14px;margin-top:20px}
  .autopsy h4{font-size:11.5px;letter-spacing:.18em;margin-bottom:12px}
  .autopsy dl{grid-template-columns:1fr;gap:0}
  .autopsy dt{padding-top:13px;font-size:11.5px}
  .autopsy dd{font-size:15.5px;line-height:1.8}
  .slot{font-size:14.5px;padding:9px 0}
  .slot .rm{min-height:36px;padding:8px 15px;font-size:12px}
  .stats{font-size:11.5px;gap:10px}
  .wbtn{font-size:14.5px;padding:13px;min-height:48px}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .ent{font-size:14px;padding:10px}
  .ent small{font-size:11px}
  .modal{padding:14px 10px 40px}
  .mbox{padding:18px 15px}
  .mbox h2{font-size:17px}
  .tabs button{padding:8px 13px;font-size:12px;min-height:36px}
  .pick{padding:12px;font-size:14.5px;min-height:48px}
  .pick small,.pick .perk,.pick .draw{font-size:11.5px}
  .picklist{max-height:none}
  .foot{font-size:11px;padding:26px 0 calc(30px + env(safe-area-inset-bottom))}
}
@media(max-width:420px){
  body{font-size:16px}
  .grid{grid-template-columns:1fr}
  .hud{font-size:11px;gap:4px 10px}
  .bar{width:42px}
}

/* ---------- HUD ---------- */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(8,9,13,.94),rgba(8,9,13,.72));
  border-bottom:1px solid var(--line);margin-bottom:22px}
.hud{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;flex-wrap:wrap;gap:7px 22px;align-items:center;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px;letter-spacing:.06em}
.brand{color:var(--blood2);font-weight:700;letter-spacing:.28em;font-size:14px}
.hud .it{display:flex;align-items:center;gap:7px;color:var(--dim)}
.hud .it b{color:var(--ink);font-weight:500}
.bar{width:72px;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .35s ease}
.b-hp i{background:linear-gradient(90deg,#7a1f22,#e0474c)}
.b-ex i{background:linear-gradient(90deg,#5a4a1a,#c9a227)}
.b-su i{background:linear-gradient(90deg,#1f4a5a,#4fb3a5)}
.hud .spacer{flex:1}
.hud button{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:12.5px;
  padding:4px 11px;cursor:pointer;border-radius:3px;letter-spacing:.08em}
.hud button:hover{color:var(--ink);border-color:var(--line2)}
.alarm-on{color:var(--blood2)!important;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- 主区 ---------- */
main{min-height:60vh;padding-bottom:40px}
.chapter{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.34em;color:var(--dim);
  margin:28px 0 14px;display:flex;align-items:center;gap:12px}
.chapter::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.prose p{margin:0 0 18px;text-indent:2em}
.prose p.na{text-indent:0}
.prose em{color:var(--gold);font-style:normal}
.prose .warn{color:var(--blood2)}
.prose .cool{color:var(--jade)}
.prose q{color:var(--jade);font-style:normal}
.prose .inner{color:var(--dim);font-style:italic}
.sep{height:1px;background:var(--line);margin:22px 0}

.choices{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.choice{
  position:relative;text-align:left;background:linear-gradient(90deg,rgba(255,255,255,.035),rgba(255,255,255,.008));
  border:1px solid var(--line);color:var(--ink);padding:15px 18px 15px 22px;
  font:inherit;font-size:17px;line-height:1.65;cursor:pointer;border-radius:2px;
  transition:all .16s ease;overflow:hidden}
.choice::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blood);transform:scaleY(0);transform-origin:top;transition:transform .2s}
.choice:hover{background:linear-gradient(90deg,rgba(179,39,43,.14),rgba(255,255,255,.02));border-color:var(--line2);transform:translateX(3px)}
@media(hover:none){.choice:hover{transform:none}}
.choice:hover::before{transform:scaleY(1)}
.choice .hint{display:block;font-family:ui-monospace,monospace;font-size:12.5px;color:var(--dim);margin-top:7px;letter-spacing:.04em;line-height:1.6}
.choice .hint .ok{color:var(--jade)}
.choice .hint .bad{color:var(--blood2)}
.choice .hint .risk{color:var(--gold)}
.choice.gold::before{background:var(--gold)}
.choice.gold:hover{background:linear-gradient(90deg,rgba(201,162,39,.14),transparent)}
.choice.jade::before{background:var(--jade)}
.choice.jade:hover{background:linear-gradient(90deg,rgba(79,179,165,.13),transparent)}

/* ---------- 侧栏 ---------- */
aside{position:sticky;top:78px;padding-top:26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px;margin-bottom:14px}
.card h3{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.24em;color:var(--dim);
  font-weight:500;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.slot{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.055);font-size:15px}
.slot:last-child{border-bottom:0}
.slot .k{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);letter-spacing:.08em;flex:0 0 46px}
.slot .v{flex:1;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .v.empty{color:#5a606c;font-style:italic}
.slot .rm{flex:0 0 auto;background:rgba(179,39,43,.16);border:1px solid rgba(179,39,43,.55);color:var(--blood2);
  cursor:pointer;font-family:ui-monospace,monospace;font-size:11.5px;letter-spacing:.08em;
  padding:3px 10px;border-radius:2px;transition:all .15s}
.slot .rm:hover{background:rgba(179,39,43,.45);color:#fff}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);margin-top:12px;line-height:1.9}
.stats span b{color:var(--ink)}
.wbtn{width:100%;margin-top:12px;background:none;border:1px solid var(--line2);color:var(--ink);
  padding:11px;font:inherit;font-size:14.5px;cursor:pointer;border-radius:2px;letter-spacing:.06em}
.wbtn:hover{background:rgba(255,255,255,.05)}
.wbtn:disabled{opacity:.32;cursor:not-allowed}
.wbtn.danger{border-color:rgba(179,39,43,.5);color:var(--blood2)}
.wbtn.danger:hover{background:rgba(179,39,43,.16)}
.picklist{display:flex;flex-direction:column;gap:7px;max-height:400px;overflow:auto;margin-top:8px}
.wbar{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.wbar .rm{flex:0 0 auto;background:rgba(179,39,43,.16);border:1px solid rgba(179,39,43,.55);color:var(--blood2);
  cursor:pointer;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.05em;
  padding:5px 12px;border-radius:2px;transition:all .15s}
.wbar .rm:hover{background:rgba(179,39,43,.45);color:#fff}
.pick{text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--ink);
  padding:10px 12px;font:inherit;font-size:14.5px;line-height:1.6;cursor:pointer;border-radius:2px}
.pick:hover{border-color:var(--jade);background:rgba(79,179,165,.1)}
.pick.own{border-color:var(--gold);background:rgba(201,162,39,.09)}
.pick small{display:block;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--dim);margin-top:4px}
.pick .perk{display:block;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--gold);margin-top:3px}
.pick .draw{display:block;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--blood2);margin-top:2px}
.codebox{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);white-space:pre-wrap;line-height:1.75;word-break:break-word}

/* ---------- 死亡 ---------- */
.death{border:1px solid rgba(179,39,43,.5);background:linear-gradient(180deg,rgba(179,39,43,.10),rgba(0,0,0,.25));
  padding:30px;border-radius:3px;margin:22px 0;position:relative;overflow:hidden}
.death::before{content:"死亡";position:absolute;right:-14px;top:-30px;font-size:140px;font-weight:900;
  color:rgba(179,39,43,.07);letter-spacing:-.04em;pointer-events:none}
.death h2{font-size:22px;color:var(--blood2);letter-spacing:.14em;margin-bottom:8px;font-weight:600}
.death .tagline{font-family:ui-monospace,monospace;font-size:13px;color:var(--dim);letter-spacing:.06em;margin-bottom:20px;
  padding-bottom:14px;border-bottom:1px solid rgba(179,39,43,.25)}
.death .prose p{text-indent:2em;margin-bottom:18px;line-height:2.02;font-size:18px}
.autopsy{margin-top:24px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.022);
  border-radius:2px;padding:20px 22px}
.autopsy h4{font-family:ui-monospace,monospace;font-size:12.5px;letter-spacing:.26em;color:var(--dim);
  margin-bottom:16px;font-weight:500}
.autopsy dl{display:grid;grid-template-columns:84px 1fr;gap:10px 16px;font-size:16px;line-height:1.85}
.autopsy dt{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--dim);letter-spacing:.05em;padding-top:5px}
.autopsy dd{color:#c9c6c1;margin:0}
.autopsy dd.cause{color:var(--blood2);font-weight:500}
@media(max-width:560px){.autopsy dl{grid-template-columns:1fr;gap:2px 0}.autopsy dt{padding-top:10px}}
.death .meta{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);margin-top:16px;letter-spacing:.08em}

/* ---------- 图鉴 ---------- */
.modal{position:fixed;inset:0;background:rgba(4,5,8,.9);backdrop-filter:blur(6px);z-index:200;
  display:none;padding:30px 16px;overflow:auto}
.modal.on{display:block}
.mbox{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:24px}
.mbox h2{font-size:16px;letter-spacing:.2em;color:var(--blood2);margin-bottom:6px}
.mbox .sub{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);margin-bottom:20px;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.ent{border:1px solid var(--line);padding:11px 13px;border-radius:2px;font-size:14.5px;background:rgba(255,255,255,.02)}
.ent.locked{color:#3d424c;font-style:italic}
.ent b{display:block;color:var(--ink);font-weight:500}
.ent.locked b{color:#3d424c}
.ent small{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--dim)}
.ent.got{border-color:rgba(179,39,43,.45);background:rgba(179,39,43,.07)}
.ent.got b{color:var(--blood2)}
.mbox .close{margin-top:22px;background:none;border:1px solid var(--line2);color:var(--ink);
  padding:11px 24px;font:inherit;font-size:15px;cursor:pointer;border-radius:2px}
.tabs{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--line);color:var(--dim);font-family:ui-monospace,monospace;
  font-size:12.5px;padding:6px 14px;cursor:pointer;border-radius:2px;letter-spacing:.1em}
.tabs button.on{color:var(--ink);border-color:var(--blood);background:rgba(179,39,43,.12)}
.foot{color:#3d424c;font-family:ui-monospace,monospace;font-size:11.5px;text-align:center;padding:34px 0 44px;letter-spacing:.14em}
.mbox h2{font-size:20px;letter-spacing:.2em;color:var(--blood2);margin-bottom:8px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<header>
  <div class="hud">
    <span class="brand">萤</span>
    <span class="it">体力 <span class="bar b-hp"><i id="hpbar" style="width:100%"></i></span><b id="hpv">100</b></span>
    <span class="it">注目 <span class="bar b-ex"><i id="exbar" style="width:0"></i></span><b id="exv">0</b></span>
    <span class="it">嫌疑 <span class="bar b-su"><i id="subar" style="width:0"></i></span><b id="suv">0</b></span>
    <span class="it">时刻 <b id="clk">23:40</b></span>
    <span class="it" id="alarmwrap">警备 <b id="alv">常态</b></span>
    <span class="spacer"></span>
    <button id="btnGear">着装</button>
    <button id="btnCodex">死法图鉴</button>
    <button id="btnRestart">重开</button>
  </div>
</header>

<div class="wrap">
  <main>
    <div id="chapter"></div>
    <div id="story" class="prose"></div>
    <div id="choices" class="choices"></div>
  </main>

  <aside>
    <div class="card">
      <h3>着装 <span style="color:#4a4f59">WOOD</span></h3>
      <div id="slots"></div>
      <div class="stats" id="statline"></div>
      <button class="wbtn" id="btnWardrobe">调整着装</button>
      <button class="wbtn danger" id="stripAll">全部脱下</button>
    </div>
    <div class="card">
      <h3>随身</h3>
      <div id="bag" class="codebox">（空）</div>
    </div>
  </aside>
</div>

<div class="foot">萤 · 白鲸塔 &nbsp;|&nbsp; 一场可以输的戏</div>

<div class="modal" id="modal">
  <div class="mbox">
    <h2 id="mtitle">死法图鉴</h2>
    <div class="sub" id="msub"></div>
    <div class="tabs" id="mtabs"></div>
    <div id="mbody"></div>
    <button class="close" id="mclose">合上</button>
  </div>
</div>

<script>
/* =======================================================================
   萤 · 白鲸塔  —— 文字冒险 / 单文件
   本文件由四段拼接：引擎、装备表、死法表、场景图。
   ======================================================================= */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

const SLOT_NAMES = {outer:'外层', top:'上身', bottom:'下身', underwear:'内衣', socks:'袜子', shoes:'鞋', tool:'随身'};
const SLOT_ORDER = ['outer','top','bottom','underwear','socks','shoes','tool'];

/* ------------------------------------------------------------------ */
/* 装备表                                                              */
/* ------------------------------------------------------------------ */
const WEAR = {};
function def(o){ WEAR[o.id] = o; }

/* ---------------- 外层 ---------------- */
/*
  每件衣服都带 tags（供场景判定识别）与 perk/draw（写清它的特殊效果与代价）。
  tags 关键词：silent 静音 · formal 正式 · uniform 制服 · shiny 反光 · sheer 轻薄透
             armored 防护 · warm 保暖 · bare 赤裸 · lace 蕾丝 · wet 防水
             pocket 有口袋 · heel 高跟 · grip 抓地 · loose 宽松 · tight 紧身 · loud 招眼
*/
def({id:'trench', slot:'outer', name:'黑色长风衣', stealth:16, mobility:2, armor:4, charm:2, expo:-12,
  tags:['pocket','loose'], 
  perk:'内衬可藏刀，血迹被衣摆压住；所有"藏东西过检查"的判定 +12%',
  draw:'下摆长，翻窗、钻管道时会被勾住',
  desc:'内衬撕开可以藏一把刀。衣摆长过膝，压得住血迹。'});
def({id:'raincoat', slot:'outer', name:'半透明雨衣', stealth:8, mobility:8, armor:0, charm:-2, expo:4,
  tags:['shiny','wet'],
  perk:'雨水不沾身，涉水与湿地移动不受减速',
  draw:'灯下反光，摄像与人眼都容易抓到；里面穿什么一清二楚',
  desc:'廉价塑料，会在灯下反光。好处是滴水不沾，坏处是里面穿什么一清二楚。'});
def({id:'gown', slot:'outer', name:'墨绿晚礼裙', stealth:-6, mobility:-8, armor:0, charm:26, expo:10,
  tags:['formal','loud'],
  perk:'宴会场合理由入场；"伪装成宾客"一类判定 +30%',
  draw:'跑不动。任何需要奔跑、翻越的判定 -25%',
  desc:'开背到腰。穿上它，你是一张请柬；脱掉它，你是一把刀。'});
def({id:'overalls', slot:'outer', name:'工装连体服', stealth:12, mobility:-2, armor:6, charm:-6, expo:-16,
  tags:['uniform','pocket'],
  perk:'被当成维修工；在机房、设备层、后厨不会被多看一眼',
  draw:'宴会厅一类场合进不去，会当场被保安拦下',
  desc:'维修组制服。口袋里有一只扳手和半包烟。'});
def({id:'nothing_outer', slot:'outer', name:'（不穿外层）', stealth:-4, mobility:6, armor:0, charm:6, expo:14,
  tags:['bare','tight'],
  perk:'少了四斤布，翻窗、钻缝、攀爬的判定 +8%',
  draw:'没有口袋，藏不住刀；血迹直接留在皮肤上',
  desc:'把外层留在天桥上，轻了四斤，也薄了一层。'});

/* ---------------- 上身 ---------------- */
def({id:'turtleneck', slot:'top', name:'黑色高领衫', stealth:12, mobility:2, armor:2, charm:2, expo:-10,
  tags:['silent','tight'],
  perk:'高领遮住喉咙与颈上的疤；被搜身时"检查颈部"的判定不会触发',
  draw:'领子被抓住就是致命处',
  desc:'高领。遮住喉咙，也遮住颈上的疤。'});

const DEATHS = {};
function D(id, o){ o.id = id; DEATHS[id] = o; }

/* ================= 处决类：被人抓住以后 ================= */
D('taser', {name:'电击棒', kind:'处决', tagline:'两万伏，然后是绳子',
  text:`第一下打在腰侧的时候，你以为是有人从背后伸手进来，隔着皮肉握住了你的脊椎，然后猛地一攥。膝盖先着地，牙齿咬到舌头，血腥味在嘴里散开，你才听见自己已经在叫了，那声音比你想象中短，也比你想象中小。
第二下落在后颈。整个人像被人从身体里抽走了一部分，视野白了一瞬又回来，回来的时候，手已经不听使唤了。刀从指间掉在瓷砖上，弹了一下，转了两圈，停住。
他们把你按在地上。一只手掌压着你的后脑，把半边脸按进地砖的缝里，粗糙的那一面磨着颧骨；另一只手从腰后抽出一卷束线带，"咔"地拉出一段。这个声音你听过很多次，在训练场，在别人的手腕上，只是从来没有在这个方向响起过。
"几楼的？"有人问，语气像在问一个迟到的人。
你说不出话，不是不想说，是舌头还不归你管。束线带先绕手腕，再绕脚踝，收到能听见皮下有什么细小的东西被挤开。最后才是正题——第三根，绕过脖子。
收紧的那一下你才明白，前面两根不是用来绑你的，是用来让你没法用手去挡第三根的。进气变成一条细哨音，出气也是，两条哨音中间夹着一段越来越长的空白。地砖是凉的，汗是热的，两样东西在你脸下面交替着，很快你就分不清了。
最后你看见的是天花板上的日光灯，一格一格往后退，像有人在拖着你走。
你确实在被拖。膝盖在地砖上蹭出两道温热的痕，一直延伸进货梯后面的黑暗里。
灯灭了。`,
  after:`走廊的监控在天亮前被格式化了。保洁阿姨第二天早上在货梯后面拖出一卷地毯，嘀咕了一句"谁把地毯乱扔"。`,
  struggle:{label:'用后脑撞他的鼻梁', base:0.28, tag:'force', ok:'kick_escape', backup:'taser2'}});

D('taser2', {name:'再收紧一次', kind:'处决', tagline:'第二次尝试，没有第二次机会',
  text:`你撞到了，但那不是鼻子，是下巴——骨头很硬，震得你自己的后脑发麻。
他的头往后一仰，然后慢慢低下来，看着你，眼神里没有愤怒，只有那种正在做一件例行工作却被人打扰的不耐烦。他用手背擦了下巴，看了一眼手背，没出血。
"还动。"
他把那根束线带重新从你脖子上绕过去，这一次没有留缝，收得很干脆，像是本来打算做的最后一件事被提前了。
气管被压成一条细缝，空气只能从那道缝里进出，每一下都带着哨音。视野的边缘开始起白点，白点连成片，像冬天玻璃上结的霜，从四角往中间爬。你想抬脚，脚不动；你想抓他的手腕，手指只能在他袖子上划出一点点皱。
最后你把舌头伸了出来，不是你想伸的，是肌肉先松了。
他站起来，抖了抖裤子上的灰，不看你了，低头点了根烟。火光在他脸上亮了一下，又暗下去。
你躺在那儿，仍然睁着眼。烟味的尾端很淡，飘了大概十几秒才散。`});

D('neck', {name:'折断颈椎', kind:'处决', tagline:'一声很轻的响',
  text:`他从背后抱住你的头，两只手一左一右扣在你的耳后，手很暖，力道却像一副早就量过尺寸的夹子。
你其实认得这个动作。训练手册第十七页有图解，配的文字是"单手即可以最小的体力消耗完成，适用于体重差二十公斤以内的目标"。当时你还在旁边画了个圈，写了句"如果对方有头发会更省力"。
你挣扎，指尖抠进他的前臂，指甲在旧伤疤上滑过去，断了两根。他没有躲，也没有加快，只是把你的头往一个方向慢慢转，转到某个角度之后停了一下，像在确认位置。
然后是一声很轻的响。不是电影里那种"咔嚓"，更像有人在很近的地方掰断了一根干树枝，脆、短、微不足道。
世界翻了个面。你还睁着眼，还能感觉到光，但脖子以下全部消失了，像被人从肩膀那里干净地剪掉。呼吸还在继续，只是不再由你决定节奏——它自己往下走，一下比一下浅。
他把你放下，让你侧躺在地毯上，动作甚至算得上温柔，还顺手把你的裙子往下拉了拉，让裙摆盖住膝盖。
你最后看到的是地毯的绒毛，一根一根，很近，很近，其中几根上沾着一小块你出门前没擦干净的泥。
几分钟后有人进来，说了句"处理一下"，然后是拖拽的声音。你被卷进那块地毯里，卷得很紧，紧到你的脸贴着自己的膝盖。`});

D('choke', {name:'抹布', kind:'处决', tagline:'在机房的角落里被捂死',
  text:`机房六十度，四台离心机在响，声音连成一片，像是有人把整个房间放进了水里。你进来的时候满身是汗，汗把衣服黏在背上，每一寸布料都贴得很实。
他从后面把一块浸过清洁剂的抹布按在你的脸上，动作快而熟练，一只手扣着你的后脑，另一只手压着布料。
你抓，你蹬，你的指甲在水泥地上刮出十道白痕，其中一道一直拖到了墙根。清洁剂的味道从鼻腔一路烧进喉咙深处，像有人把一整瓶氨水直接灌进了你的肺。那不是呛，那是烧，从里面开始烧。
你的身体开始抽搐，不是你让它抽的。腰、腿、手指，各自为政，各自在跟那块布较劲。他一条腿压着你的胳膊，膝盖顶住你乱踢的小腿，始终很有耐心，像是做过很多次，也像是不介意做多久。
三十秒。一分钟。两分钟。你听见自己的心跳在耳朵里越来越慢，到最后变成一种很大的、隔着一层水的声音。
然后它停了。
他等了十几秒才松开手，把抹布拎起来看了一眼，扔进门口的塑料桶。桶盖上写着"请勿饮用"，字是打印的，下面还贴了一张已经卷边的值班表。
你脸朝下趴在那儿，眼睛仍然睁着，瞳孔上蒙了一层灰。离心机还在响，声音一点没变。`});

D('beaten', {name:'棍棒', kind:'处决', tagline:'三个人，一根消防斧柄',
  text:`你被围在楼梯间的转角，退到墙和墙的交界，背后没有路了。
第一个人用斧柄打你的膝窝，你跪下去，膝盖磕在水磨石上，那一下的声音比痛先到；第二个人从侧面打你的后背，你趴下去，脸贴着地；第三个人打你的手，你松开刀，刀滑出去三米，卡在防火门的门缝里。
之后他们不再有章法了，只是打。斧柄落下来的地方越来越多，肩、肋、腰、大腿外侧，每一处疼的等级都不一样，混在一起变成一种很响的白噪音。
肋骨断了三根，其中一根往里扎进了肺，你每次吸气都能听见自己胸口的嘶嘶声，像漏气的轮胎。你想咳嗽，但咳嗽需要的气你吸不进来。
你的脸贴在冰凉的水磨石上，血从嘴角流出去，沿着地砖的缝铺成一小片，边缘慢慢往外渗。
在那之前，你一直在数。这大概是某种本能，给疼痛编号，就等于把它放进盒子里。你数到二十七。
第二十八下打在太阳穴上。
你没数完。`,
  struggle:{label:'抓他的脚踝', base:0.2, tag:'force', ok:'hostage_moment', backup:'beaten2'}});

D('beaten2', {name:'二十八下之后', kind:'处决', tagline:'他们打累了才停',
  text:`你抓到了脚踝。只是抓到了，手指像钩子一样扣在袜子和裤脚之间那一小截皮肤上，扣住的那一刻你甚至有点高兴。
他低头看了一眼，把脚抽出来——不快，甚至有点随意——然后鞋跟碾在你的手背上，一次，两次，三次。骨头的响比骨头本身更清晰，那是你自己的骨头，你听得出来。
"这女的有病。"
他们打得更随意了，像在拆一个已经没人要的旧柜子，敲一敲，踹一踹，看哪块先掉。有人在过程中还接了个电话，说了句"马上下来"，然后就站在旁边等你不动为止。
你不再感到疼，只感到一种很深的下沉，像掉进一块湿透了的棉花里，越沉越暖。你想起安全屋窗上贴的那张报纸，湿了又干，干了又湿，边缘已经卷起来。
最后你听见有人说"够了"，然后是脚步声远去，防火门被带上，金属碰撞的余音在井道里荡了几秒。
你还是躺在那儿。血从台阶的缝里往下渗，一层一层，每一层的颜色都比上一层深。夜里有人经过了一次，脚步停了半秒，然后继续往上走了。`});

D('sniper', {name:'对街的枪', kind:'处决', tagline:'你甚至没听见枪声',
  text:`你在天桥的玻璃幕墙里看到了自己的倒影，还伸手理了一下头发。那绺头发被雨粘在脸侧，你把它拨到耳后，动作很随意，像所有站在雨里等车的人。
对面的楼顶，一支枪口正对着这个倒影。瞄准镜里的十字线落在你的耳后三公分处，那是最稳的位置——他在等一个不动的瞬间，而你刚好给了他。
八百米，风偏半格。他扣扳机的时候，你正在想"这件衣服是不是太薄了"。这是你最后一个完整的念头，它甚至不是什么重要的念头。
子弹从右太阳穴进，左颧骨出。
你站着，还站了零点七秒。这零点七秒里你什么都想不起来，什么都听不见，耳道里只有一片很长的嗡鸣，眼睛还睁着，看着白鲸塔的灯一层一层地亮，亮到你数不清。
然后你向前倒进雨里。
雨是热的。不，雨是冷的，热的是你自己。热水从你的头发里流出去，被雨水稀释，在你脸边积成一小片浅浅的暖，很快就凉了。`,
  after:`"回廊"在凌晨三点确认了信号中断。第二天，任务派给了代号"竹"的另一个人。没有人提起你。这就是这一行的规矩。`});

D('hostess', {name:'迎宾的尽头', kind:'处决', tagline:'被认出来的时候，你还微笑着',
  text:`你把托盘举起来，笑容标准得可以写进培训手册——下巴收一点，眼睛弯一点，视线落在客人肩膀上方，不直视。这套你练过。
大堂经理走过来，他也笑，笑得比你更好看，也比你更稳。
"三号的那个迎宾，今天休息。"他说，语气像是在聊天气，"你是谁？"
你抬手，但他的手更快，一支钢笔已经抵在你的颈侧。笔尖是淬过的，你能感觉到那一小点凉，就贴在颈动脉跳动的地方，随着你的心跳一下一下地晃。
"别在这里。"他还在笑，眼睛看着你身后的大厅，"血不好擦。"
两个穿黑西装的人一左一右架住了你的胳膊，动作很轻，轻得像在扶一位喝多了的客人。你的脚被抬离了地面，那双九公分的鞋在红毯上划了一下，划出一道很浅的痕。
你被带进员工通道。门在身后关上，把弦乐和大厅的暖气一起关在外面。
里面很黑，只有尽头的应急灯。你听见布料摩擦的声音，听见自己心跳的声音，听见有人在很近的地方把笔帽旋上。
然后——`,
  struggle:{label:'用发簪刺他', base:0.34, tag:'mobility', ok:'corridor_break', backup:'hostess2'}});

D('hostess2', {name:'员工通道', kind:'处决', tagline:'后面的事没有人拍下来',
  text:`发簪拔出来了，但是你算错了距离，也算了错方向——你以为他站在那儿，其实他退了半步。
簪子钻进他的衣领，卡在锁骨上面，只划出一道白印，白得几乎看不见。
"还挺野。"
他被按在管理员的铁柜上。你的脸贴着柜门，铁是冰的，上面贴着一张员工排班表，塑封过，边缘翘起来。你的呼吸喷在上面，把它吹得一下一下地鼓。
他从你的后颈落下那支笔，很细，很凉，像一根针穿过了你从来没被碰过的地方。
你听见自己身体里有东西在漏，那种声音像水管里的水在慢慢找出口。
有人在门外敲门："经理？"
"没事。"他说，声音一点没变，"猫打翻了东西。"
你顺着柜门滑下去，手指还勾着那张排班表，把它撕下来的一角。那一角上有一个名字，被你的指甲划破了。`});

D('knife', {name:'被自己的刀', kind:'处决', tagline:'反杀失败',
  text:`你扑上去的那一秒就知道错了。这个认知没有让你停下来，它只是让你在往下坠的时候多了一层旁观者的清醒。
他的重心没有偏，他的下盘像浇在水泥里的铁。他侧身，抓你的手腕，一拧——
刀转了方向，握柄朝天，刀刃朝着你自己。
你的手臂被别到背后，他的体重压上来，带着你的手，把你的刀送进了你自己的肋下。
很慢。他做得很慢，慢得你能感觉到金属在皮肉里推开的每一寸，能感觉到它擦过肋骨的表面，滑进去，然后停在某个地方。
"我干这行二十二年了。"他在你耳边说，气息很稳，没有一点喘息，"你太瘦了。"
你跪下去的时候，他松了手，退开半步，站着看你。
你捂着肋侧，血从指缝里涌出来，一滴一滴落在他的鞋尖上。他皱了皱眉，骂了一句，把脚往旁边挪了挪，然后从口袋里掏出手机，看了眼时间。`,
  struggle:{label:'撑起来再撞一次', base:0.24, tag:'force', ok:'desperate_out', backup:'bleed'}});

D('bleed', {name:'失血', kind:'处决', tagline:'你爬了很久，只爬了三米',
  text:`你在地上爬。地毯是浅色的，你的手印一个接一个地留在上面，像有人打翻了一整罐红漆，又用袖子胡乱地拖了几道。
你数自己的呼吸。第一下很深，第二下浅一点，第三下开始有点甜。那种甜你也熟悉——十七岁那年，你在体校的澡堂里晕倒过一次，醒来的时候闻到的是同样的味道，铁锈，和温水煮过的铁锈。
你爬到门口。门是关着的，白色的，上面有一块小小的牌子写着"消防通道保持畅通"。
你把脸贴在门缝下面，那儿有一线光，很薄，从走廊的灯那里漏进来，落在你的睫毛上。
然后你就没有再往前。不是你不想，是你的手臂已经不接受指令了，它们在动，但方向不对。
第二天早上，人们发现一个穿着风衣的年轻女人趴在走廊尽头，姿势像是在吻地板。
最先发现她的那个保洁员说，她的一只手是握着的，像抓着什么东西。他们掰开来看，里面什么也没有。`,
  struggle:{label:'用牙咬开自己的手腕止血', base:0.3, tag:'wit', ok:'crawl_out', backup:'bleed2'}});

D('bleed2', {name:'止不住', kind:'处决', tagline:'你咬到了，但太晚了',
  text:`你咬下去了——不是手腕，是手腕下面更靠近血管的那一块。牙齿陷进自己的皮肉，很疼，但那点疼跟肋下那个洞比起来什么都不是。
压不住。
血还是从指缝里往外冒，只是换了节奏，一涌一涌的，像有人在你的身体里打拍子，而你的手指跟不上那个拍子。
你开始冷。不是天气的冷，是从骨头缝里往外渗的那种冷，从脚趾开始往上，一层一层地把感觉关掉。
你的睫毛上凝了一层很细的汗珠，你甚至能感觉到它们在结。
最后你想的是两件事：风衣的内衬是不是剪开了？刀是不是还藏在里面？
答案是：是。
那把刀就在你左肋下面那一层布和布之间，一直贴着你的身体，跟着你从安全屋走到这里。
但没有人会知道你到底埋了什么。明早来的人会把你和那件风衣一起装进袋子，编号，登记，然后在单子上写"无随身物品"。`});

/* ================= 意外类：楼自己会杀人 ================= */
D('shaft', {name:'电梯井', kind:'意外', tagline:'二十七米，一点五秒',
  text:`检修门的锁比看上去好开，你用了不到四十秒，还顺手把锁舌按了回去，让门看起来是关着的。这是个好习惯，很多人在这一步就露馅了。
你踩上去的那一步，踩的不是检修台，是一块被拆掉一半的配重盖板。它在你脚下轻轻一翘，像有人在下面用肩膀顶了一下。
盖板翻下去，你跟着翻下去。
你伸手，手指擦过钢缆，钢缆上全是油，那种黑而稠的润滑油，冰冷的、滑得像活的东西。你抓到了一手油和一声自己都没听清的音节，那个音节很短，短到你自己都不确定是不是从你嘴里出来的。
下落的时候人是可以思考的，这一点你以前不知道。你想了三件事：今天是几号；风衣现在留在外面了，里面还有半包烟；如果下面是配重块的话，大概会很快。
是配重块。
二十七米，一点五秒。一点五秒里你经历了六十公斤的加速、八吨的静止，和一声闷响。那声闷响之后，井道里安静得出奇，只有钢缆还在轻轻地嗡，像一根被拨过的弦。
井道顶上有一只灯还亮着，黄色的，一直亮着。它照着底下那堆不再动的东西——风衣的一角被甩在外面，露出一段白的手腕。
<span class="inner">（后来检修工写报告时写：井底有异物，疑似违规丢弃的服装模特。）</span>`});

D('compactor', {name:'垃圾压缩机', kind:'意外', tagline:'按下去的时候，你正在里面',
  text:`垃圾道的滑门在你身后合上了，合得很轻，轻得让你以为它只是没关严。
你顺着湿滑的不锈钢壁往下滑，滑进一个大约两平米的铁箱。铁箱里有一股很浓的味道，是剩饭、消毒水和某种已经发酵很久的甜。你在那股味道里站起来，抬头。
头顶的灯闪了两下，红了。
你看着那盏红灯，用了大概三秒钟才明白它是什么意思。
液压臂开始往下压。它启动的时候没有警报，只有液压油流动的声音，很平稳，像一个正在慢慢呼吸的人。
你尖叫，拳头砸在铁壁上，砸出四个闷响。垃圾箱里没有人听得见尖叫，只有回声，和回声撞在回声上的回声，那声音听上去竟然很陌生，不像你的。
液压板先贴到你的头顶，你弯下腰；贴到你的背，你跪下去；贴到你的膝盖，你只能抱着自己的小腿，像抱一个婴儿。你最后能看见的地方是两片铁板之间那条越来越细的缝。
然后肋骨开始断。一根，两根，接着是连着的一排，声音很密，像有人在很远的地方放鞭炮。你的脸被压在自己的膝盖上，嘴唇碰到的是自己的皮肤。
四点零七分，清运车把那个箱子倒进了货车。厂里的人后来把它丢进了填埋场，没人打开过。
<span class="inner">（那件风衣和别的东西一起压在最底下，二十公分厚，还在原来的位置。）</span>`});

D('rebar', {name:'钢筋', kind:'意外', tagline:'从四层掉进一根竖着的钉子上',
  text:`你从通风井的第四层失手，脚下一块石膏板在你还没站稳的时候就塌了。
坠落大概只有三米，很短，短得你甚至来得及在心里骂一句。
底下是施工用的钢筋束，被雨淋得发黑，断口还带着毛刺，其中一根朝上，直径两公分。
它从你的左后腰进去，从你小腹的侧面出来。你听见的不是刺穿的声音，而是一种更怪的、很闷的"咕"——像有人把一根钉子敲进了一块湿木头。
你被钉在钢筋上，脚离地四十公分，整个人挂在那根朝上的钉子上，书包一样。
你没有立刻死。这是最糟的部分。
你抓着钢筋，手在往下滑，血让整根钢筋变得像抹过油；你喊，喊出来的都是气，气在雨里散得很快；你看见自己的血顺着钢筋往下淌，在水泥地上积成一小汪，越扩越大，边缘慢慢爬过一块碎砖。
你在那根钢筋上待了四十分钟。四十分钟里，你数过三辆经过的车、两次门响、一次手机铃声。雨一直下，把血冲淡，冲成一圈越来越浅的红，到最后只剩下一层很薄的粉色，随时会被下一阵雨带走。
最后是一个夜班工人发现的。他吐了，然后打电话，说话一直在抖，说了三遍才把地址说清楚。
<span class="inner">（清理的人用了一把液压剪，剪断钢筋的时候，你已经不在上面了。）</span>`,
  struggle:{label:'把自己拔下来', base:0.16, tag:'mobility', ok:'impale_out', backup:'rebar2'}});

D('rebar2', {name:'拔不出来', kind:'意外', tagline:'你试过了，这就是结果',
  text:`你抓住钢筋，把自己往上撑。
钢筋在你的身体里转了半圈。这一点点转动，是今晚所有事情里最糟的一件。
眼前全白了，耳边的雨声变成一片长长的嗡鸣，你差点直接昏过去，但你没有——疼把你钉在清醒里，一寸都不许你走。
你松手，又挂回去，这一挂比刚才更低了一点，脚背碰到了地面，脚尖撑着，像踮着脚往前看的人。
血开始换成另一种流法，一汩一汩的，每一汩都带走一点温度。你不再喊了，因为喊很费力气，而力气要留着——留着干什么？你也不知道，你只知道不能把它用掉。
你把脸仰起来，让雨落在脸上。雨是干净的，从很远的地方来，经过很多屋顶，落在你脸上还是干净的。你是脏的。
大概二十分钟后，你不再感到腰以下的部分。
再十分钟后，你不再感到任何部分。你没有闭眼，雨一直落在你睁着的眼睛里，把它冲得很亮。`});

D('cable', {name:'钢缆', kind:'意外', tagline:'脖子被夹在两层钢索之间',
  text:`你在电梯轿厢顶上，趴着，两只手扣着顶板的边缘，膝盖夹在两根加强筋之间。
轿厢在上行。风从井道顶上灌下来，灌得你睁不开眼，只能把脸埋在小臂上，靠声音判断高度。
穿过四十三层的时候，你没有抬头。这是你今晚做对的最后一件事——如果抬头，你会看见反绳轮正在转。
对重的反绳轮在那一刻开始转动，一股钢缆从你左侧掠过去，很快，带着油腥味。你下意识地歪了一下头，那个动作纯粹是本能，跟判断无关。
钢缆卡进了你的颈侧，然后被自身的张力拉紧。
它没有切断你。它只是把你按在了梁上——就像两根手指按住一颗弹珠。颈椎在零点三秒内被拧到了一个不可能的角度，气管断成两截，颈动脉被拉成一根绷紧的线，但没有破。
你挂在井道里，随着轿厢的震动轻轻晃，晃得很规律。
四十六层到四十七层，十二秒。这十二秒里，人已经不能算人了——你的脚还在轻轻蹬，跟呼吸没有关系，跟什么都无关。
最后轿厢停了，门开了。灯照上来的时候，井道里那点轻微的晃动也停了。`});

D('door', {name:'电梯门', kind:'意外', tagline:'一半在里面，一半在外面',
  text:`门开始合的时候，你把右腿伸了进去。这是本能，任何一扇要关的门前，人都会这么干。
传感器没响。这是一部老式货梯，传感器十年前就坏了，一直靠"有人看见就按开门键"维持——这件事你当然不知道，你只知道门没有退回去。
电梯启动了。
门缝从你的右侧腰线开始收紧。金属先压扁你的髋部，那种感觉不像被夹，更像被两只手按着往里挤，然后是腹腔，然后你听见自己身体里有什么东西被挤破的声音——很湿，很闷，像踩破一个装满水的袋子。
轿厢在上升，你被留在了楼层之间。上层的地砖离你的脸大概半米，你能看见地砖上有一道旧划痕，横着，一直延伸到墙边。
你的上半身还在外面。手指在地砖上抓，抓出五道血痕，指甲盖翻起来两个。你的下半身跟着轿厢上去了。
你在中间。
你在中间待了大概九十秒。九十秒里你一直醒着，你的手还在动，还在往前抓，抓的是那片够不到的地砖。
<span class="inner">（后来验房报告上写着：该货梯门机感应失效，建议停用。）</span>`, 
  struggle:{label:'用刀卡住门缝', base:0.3, tag:'wit', ok:'door_escape', backup:'door2'}});

D('door2', {name:'门还是合上了', kind:'意外', tagline:'刀断了',
  text:`陶瓷刀的刃卡进了门缝，你甚至感觉到它咬住了金属——有那么半秒，门停了一下。
然后它断了。断面很白，很干，躺在地砖上像一小截粉笔，不像能杀人，也不像能救人。
门继续合。你听见自己的骨盆发出一连串细碎的响，像踩碎一盒饼干，那种声音太日常了，日常到你几乎以为有别的东西在坏。
你开始大量出汗，然后开始发抖，然后不再抖。身体自己知道什么时候该放弃。
电梯上行到第四十层。门开了。
里面的人先是愣住，然后有两个当场吐了，还有一个瘫坐在地，一直在说"不是我不是我"，说了三遍才有人去扶他。
保洁组用了三个小时，换了整层的地砖，把那扇门卸下来重新装了一遍。门是新的时候，感应是好的。`});

D('dog', {name:'犬', kind:'意外', tagline:'两条杜宾，一个没关的笼门',
  text:`你从地下二层的坡道翻进来，落地的时候右脚踩到一个空的狗食盆。盆是铁的，在水泥地上滚了三米，声音在车库里绕了三圈才停。
三米之外，笼门是开的。
第一条扑上来的时候你出刀了，刀划开了它的肩，皮肉翻开，露出一层很白的筋膜。它只是摇头，甩出一圈血，又扑回来——狗不知道疼，或者说，它知道，但它不在乎。
第二条从侧面咬住了你的小腿，牙齿穿过肌肉，咬到了骨头，你听见"咯"的一声，像咬开一颗硬糖。你被拖倒，后脑磕在一辆车的保险杠上。
它们不咬喉咙。它们受过训练，不咬喉咙——它们咬的是你的小臂、你的大腿内侧、你的腹部。这是程序，不是饥饿。
四十七秒。
四十七秒之后，你的两条手臂都已经不能用了，小臂上各自有一个洞，洞的边缘像被撕过的纸。腹部缺了一大块，肠子滑出来，在你身下摊开，冒着热气，热气在冷车库的空气里很快就看不见了。
它们坐在旁边喘气，舌头很长，很红，偶尔低头舔一下自己的爪子。其中一条把鼻子凑到你的脸旁边，闻了两下，走开了。
保安赶到的时候，只来得及把狗喊住。他站在两米外看了一会儿，然后用手里的对讲机说了句"叫人来"，声音很平，像在说天气。`,
  struggle:{label:'把刀横进它嘴里', base:0.2, tag:'force', ok:'dog_live', backup:'dog2'}});

D('dog2', {name:'它比你想的快', kind:'意外', tagline:'手腕被咬断了',
  text:`你举刀横过去，对准那张张开的嘴，那里面全是牙和一条颜色很深的舌头。
它偏头，咬住了你的手腕。
牙齿切进腕骨，你听见的不是骨头断的声音，是韧带被撕开的声音，像拉开一条拉链。刀掉在地上，弹了一下，滑到车底。
第二条从你背后上来，前爪搭在你肩上，把你压下去。它的体重比你重，呼吸打在你的后颈上，热的，带腥味。
你趴在自己的血里，脸侧着，一只眼睛能看见那把刀就在三十公分以外，刀身上还沾着第一条狗的血。
你伸出左手，指尖离刀柄差一点。你差一点就够到了，你甚至觉得自己碰到了。
然后第一口咬在你的后颈上。`});

D('car', {name:'车', kind:'意外', tagline:'地下四层，倒车的时候',
  text:`地下四层的坡道很窄，柱子上包了橡胶，橡胶被蹭得发白。
你从两辆车之间穿过去。你算过间距，六十公分，你的肩宽三十五，够。你算得很对。
这是一辆加长的黑车，正在倒。倒车雷达坏了，或者司机没看，或者——这种事不需要原因，你后来想明白的唯一一件事就是它不需要原因。
保险杠撞在你的髋上，你飞出去，撞到柱子。那一下你的尾椎先撞上去，然后是后脑，眼前闪了一片白。
第二下更重。车轮从你的胸口压过去，你听见自己的胸廓像一堆晾衣杆那样散开，那一下很响，比车声还响，也比你想的清楚得多。
车轮又退回来，压了一次。这次是头。左边这一下之后，世界只剩下右边一半，然后又少了。
司机下来的时候一直在打电话，说的是"我这边路上堵，马上到"，一直在说，一直没低头。他从车头绕到车尾，看了一眼地面，皱了皱眉，回到车上，把车往前开了一米，停进了车位。`});

D('pool', {name:'泳池', kind:'意外', tagline:'水深三米，你在水底',
  text:`你从池边滑下去的时候没出声。这才是最讽刺的部分——你练了七年怎么不出声，最后用在了自己的死上。
水是温的，比空气暖，所以第一下接触的时候身体是放松的，甚至有点舒服。然后你踩空了，脚下没有底，池底在很深的地方。你呛了第一口水。
池底是大理石纹的瓷砖，铺成一头鲸的轮廓，白线勾边，眼睛是深蓝色的两小块。你在鲸的眼睛上挣扎。
腿抽筋了，从脚弓开始，一直抽到大腿根，整条腿变成一根绷紧的木头，不听使唤，只想往下沉。你划水，划得越来越难看，手臂每一次抬起来都比上一次低。
指甲抠进防滑槽，槽里有一层滑腻的藻，摸上去像坏掉的肥皂。你抠不住。
最后你不再划了，你只是看着头顶。
头顶的水面很亮，那盏灯在水面碎成一万片，一直在晃，晃得让人很想睡。你吐了最后一口气，那口气变成一串珍珠，一个一个升上去，越往上越大，到了水面就没了。
你没有升上去。
<span class="inner">（第二天早班的服务员捞了四十分钟，用的是一根带钩的长杆。）</span>`,
  struggle:{label:'蹬池壁往浅水区弹', base:0.32, tag:'mobility', ok:'pool_out', backup:'pool2'}});

D('pool2', {name:'浅水区还有十米', kind:'意外', tagline:'腿不听',
  text:`你蹬了池壁，身体从水下射出去，大概四米。这一段是有效的，你甚至觉得自己能行。
然后腿彻底废了，像两根别人的东西挂在你身上，你能感觉到它们在往下沉，但收不回来。
你换成一个自己都看不起的姿势，双手扒着池底往前刨，头抬起来喝水，再抬起来喝水。水从鼻子里进去，从喉咙里往上顶，顶得你想吐。
喝到第三口的时候你放弃了抬头。
浅水区在十米外，坡道在那里，一级一级往上走，每一级都很白、很清楚。你在水下睁着眼，能一直看到第七级。
你伸手，手指碰到了第一级。那一下很实在，你能感觉到瓷砖的光滑和那道防滑槽。就碰到了。
然后你滑下去，滑回鲸的眼睛那里。池底的水纹把你的头发托起来又放下，托起来又放下，一直到很晚。`});

D('freezer', {name:'冷库', kind:'意外', tagline:'零下二十五度，门在外面锁上',
  text:`你被人反手塞进冷库的时候，还在心里算时间——你算过，从这扇门到下一班巡检，二十分钟，二十分钟足够你出去。
门是电控的，密码锁装在正面，你在里面看不到键盘上有没有留下指纹。
你用刀撬门缝，撬了十七分钟，刀尖崩了一小块，然后是整片刃口，最后刀断了。
第一小时，你还在跳，跺脚，搓手，把手指塞进胳肢窝里。手指从疼到麻，从麻到没有感觉，从没有感觉到像五根别人的东西插在掌心里。
第二小时，你开始脱衣服。这是真的——冻死的人最后都会脱衣服，因为血管收缩到极限之后会突然放开，大量血液回到体表，人会感到一阵猛烈的热。你在那一阵热里把风衣脱了，把高领衫也脱了，钮扣冻得发脆，一扯就掉。
你赤身站在零下二十五度的铁板地上，感到非常温暖，非常困。
第三小时，你从货架下面找到一个纸箱，空的，印着冷冻牛肉的字样。你坐进去，抱着膝盖，缩成很小的一团，把下巴搁在膝盖上。
第四小时，你的呼吸变成每分钟三次、两次、一次，每一次呼出去的白雾都比上一次短。
第二天早上，厨师长拉开库门的时候，看见的是货架之间一个坐着的小姑娘，蒙着一层白霜，睫毛上挂着很细的冰，手上还抓着那件风衣的一角。
她看起来不到二十岁。他后来跟人说起这件事，只说了一句"那个女孩子，坐得很整齐"。`,
  struggle:{label:'用发簪短接门锁电路', base:0.22, tag:'wit', ok:'freezer_out', backup:'freezer2'}});

D('freezer2', {name:'电路烧了', kind:'意外', tagline:'火花之后是更深的黑',
  text:`你把发簪捅进锁体的缝里，听见"啪"的一声，一串小火花溅出来，打在你的指腹上，一点感觉都没有。
锁上的指示灯从红变绿——你几乎笑了，那半秒里你甚至连出去以后第一件事干什么都想好了。
然后绿变成全灭。
短路把这一路的供电一起烧断了。冷库里那盏主灯灭了，备用应急灯亮起来，昏黄的一小盏，挂在高处，照着你和你呼出的白雾，把你的影子拉得很长，投在两排货架上。
你开始拍门，拍到手失去知觉，拍到手变成两块没有感觉的肉，指节上的皮一层层留在铁门上。你用脚踢，踢到鞋掉了；你把额头抵在门上哭，眼泪结冰的时候，粘住了睫毛，你眨眼的时候能听见很轻的、像撕裂纸片一样的声音。
你闭上眼睛，只想睡一会儿。
你睡了一会儿。
你睡得很久。`});

D('steam', {name:'蒸汽', kind:'意外', tagline:'锅炉房的一根三寸管道',
  text:`你踩上管道的时候，阀门在楼上被人转开了——有人要试压，值班表上写着零点四十，你看过那张表，你只是没有算到自己会在零点四十还站在这里。
第一秒是白，铺天盖地的白，整个房间被抹掉了。
第二秒是烫。不是热的烫，是那种一次性把"疼"这个字用光的烫。
水蒸气从你右边的袖口、领口、裤脚同时灌进去。它没有火那样明亮的攻击性，它只是进去，进到布料和皮肤之间，然后在那里把水分全部交出来。皮整张地从肉上掀起来，像沸水里的番茄。
你想喊，但空气已经被烫进了气管，声带在第一声里就烧坏了。你发出的是一种很轻的、漏气的声音。
你从管道上掉下去，掉了两米半，摔在铁丝网上，铁丝网也开始烫，你背上的皮肤在网格里留下了一个一个菱形的印。
你在那里翻滚，翻滚的时候皮一块块地留在铁丝上，先是后背，然后是手背，然后是脸。
保洁员是最先到的。他后来说，他这辈子第一次听见有人在完全没有声音的情况下尖叫——他说他能听见，是因为那声音是从她自己身体里面传出来的，闷在胸腔里，一直没停。`});

D('fan', {name:'排风扇', kind:'意外', tagline:'头发被卷进去了',
  text:`你从风管里钻出来的时候，头发散了一绺，湿的，粘在脖子上。那不是大问题，你以前也遇到过。
排风扇的叶片是铸铝的，转速两千四，装在铁栅后面，隔着三十公分。
那绺头发先被吸进去，然后头皮被吸进去。整个头被拽向铁栅，你的脸颊撞在铁框上，颧骨凹了一块，右边眼睛当场就看不见了。
电机不减速。它从来没减速过，它的控制柜里没有"人"这个选项。
你伸手去抓铁栅，手指伸进叶片之间——三根手指切下来，落在你脚边，很白，很干净，像刚洗过的。你甚至低头看了一眼，那一眼里你还认得出那是自己的东西。
你的头和风扇之间只剩下一层脖子。
最后是脖子。
有大概两秒钟，你另外那只手还在动，还在往铁栅那边伸。然后它不动了。
那天，机房的人只看见铁栅上挂着一团黑。他们以为是别人扔的假发，还跟保洁抱怨了一句。保洁用长柄夹把它取下来的时候，才发现上面连着一整个人的重量。`});

D('fall', {name:'坠落', kind:'意外', tagline:'外墙，四十六层',
  text:`你挂在幕墙外侧的检修轨上，风把雨衣吹得鼓起来，像一面旗，也像要把你从轨道上撕下去。
往下看是什么都没有——城市在雨里，是一团很大的模糊的光，红的一条，白的一条，中间隔着一道很深的黑。
手指扣着轨道的边缘，边缘只有三指宽，上面有一层薄薄的氧化粉，摸上去像干了的肥皂。
左手先滑的。
然后是右手。
四十六层，落地大概十八秒。前五秒你还能听见风，之后听不见了，风太大，把你自己的声音也吹散了，你张着嘴，但已经没有声音在出来。
那十八秒里，你想起的是很琐碎的事：今晚出门前你没锁安全屋的窗；冰箱里还有半盒没吃完的东西；训练场的教官说过一句"跳下去的人，总是先看下面"，而你看了。
落地的时候，雨还在下。雨点继续落在你的睫毛上，落在你没有焦距的眼睛里，落在你摊开的手心里。过了很久才有人停下来看，那个人先拍了张照片，然后才打电话。`});

D('glass', {name:'玻璃', kind:'意外', tagline:'你选了门，门其实是墙',
  text:`你扑向那面"门"。走廊的灯在它上面留下一块反光，看起来确实像一扇通到外面的门。
它是玻璃墙，落地的那种，中间嵌了一条细得几乎看不见的装饰线，你撞上去之前的那半秒，才看见那条线。
玻璃没有碎。是你的锁骨先断了。那一下的钝痛从肩膀一直传到牙根，你咬到了自己的舌头。
第二下你用手肘砸，砸开了一个拳头大的洞，边缘全是尖的，像一圈牙。洞口后面是风，是雨，是四十六层高的黑。
你的冲力把你送进了洞和洞里的自己。
三根肋骨的断口从你右侧的胸壁穿出去，一截玻璃插在你的肋间，被你自己的冲力推得更深。你的身体有一半在墙里，一半在墙外，中间那段挂在玻璃的断口上，像挂在一排钉子上。
风从墙外的雨幕里灌进来，把你的血吹成扇形，溅在那面墙上，一直溅到两米高，形状很像一棵倒过来的树。
第二天清洗外墙的吊篮工人说，那面玻璃三年没擦过，那天倒是干净了。他还说，那棵血画出来的树，是整个东立面唯一他没擦掉的东西——因为他不敢碰。`});

/* ================= 屈辱类：他们不急着杀你 ================= */
D('crew', {name:'值班室', kind:'屈辱', tagline:'四个人，一盏台灯，两个钟头',
  text:`他们把你按在值班室那张桌子上的时候，你还在骂人。骂的是最难听的那些，骂到有人笑了一声，说"嘴巴挺硬"。
第一个小时，你骂。嗓子是从第二十三分钟开始哑的，到后来只剩下气声，你还是在骂。
第二个小时，你不出声了，只是咬着嘴唇，咬到出血，血从嘴角流到下巴，再滴到桌沿上，一滴一滴，节奏很慢。台灯就在你脸边，灯罩的铁边烤着你的左耳，很烫，你偏不过去。你能看见桌面上的划痕，看见有人用钥匙在角上刻了一个名字，看见桌角有一小片烟灰，还有一只没盖笔帽的圆珠笔，随着桌子一起轻轻震。
你身后的呼吸声一重一重，均匀，甚至不着急。中间他们交接了一次班，有一个人先去泡了碗面，回来的时候身上带着那种廉价的红烧味，然后换手，接着来。没有人说话。整个房间里最响的是那盏台灯的电流声。
你像一件放在这间屋子里的公用设备。有人用，有人换，没有人看它一眼。
中间有一次，你说"我叫萤"。
没有人问你是谁。那句话掉在地上，像一张没扔进垃圾桶的纸。
两个小时后，他们开始头疼怎么办。有人说得处理掉，有人说等天亮，最后是那个泡面的人拍的板。
你被套上麻袋。麻袋上有一层霉味，还有一种很熟悉的味道——速溶咖啡。以前在训练营，每天早上都有那个味道。
你被搬进货梯。门关上的时候，你想的居然是：这件风衣很贵，别弄脏了。`,
  after:`"回廊"的第二号人物在三天后看了监控。他关掉屏幕，点了一支烟，抽了一半，摁灭，然后给另一个新人打电话。他说：以后不要派女人单独进楼。`,
  struggle:{label:'趁换手的那一秒反击', base:0.18, tag:'force', ok:'break_room', backup:'crew2'}});

D('crew2', {name:'你反抗了，所以他们更慢', kind:'屈辱', tagline:'区别只在于时间',
  text:`你踢到了一个人的下巴，他被踢得退了两步，扶着墙骂了一句脏话，嘴里有血。
这一脚值得吗？值。它给你换来了一点很实在的东西：他们不再把你当成一件随手的物件，而是当成一头需要先砸服的牲口。物件不需要被教育，牲口需要。
第一下是手电筒敲的，敲在你的膝盖上，敲完以后你的左腿就再也伸不直了。
你跪在水泥地上，膝盖里像是灌进了一把碎玻璃，每动一寸都响。
然后是第二下，第三下，第四下，不需要数，因为他们不数。
之后的事他们做得更慢，也更有条理，像是对一台已经被拆开的机器做例行维护——哪里松了拧哪里，哪里响了一声就再看一眼。
你不再感到屈辱了。羞耻是一种需要力气的情绪，而你身上已经没有力气分给它，剩下的那一点全用来呼吸了。
凌晨一点四十分，他们把你塞进垃圾箱，盖上了盖。铁盖落下来的声音很大，在空车库里回了两下。`});

D('toy', {name:'玩物', kind:'屈辱', tagline:'目标说：先留着',
  text:`你被带到他面前的时候，风衣的扣子已经被扯掉了三颗，高领衫的领子被拉得变形，露出锁骨。你没有低头，你只是站着，因为你的手还被反绑在背后。
他坐在那张很长的办公桌后面，看文件，没抬头。桌上有一盏带铜座的台灯，还有一杯已经凉透了的茶。
"哪里捡的？"
"三十九层，往上的检修梯。"带你来的人回答，语气像在报一件快递。
他把文件翻过去一页，拿起笔签了名，很慢，笔画收得很干净。然后他抬眼。
那一眼里不带任何欲望——这才是最可怕的部分。他看你，像在看一件还没开封的东西，在估量值不值得拆，拆了以后放在哪。
"留着。"他说，"我这两天心情不太好。"
于是你被留在顶层。
四十八小时。四十八小时里，你被当作一件家具、一个垫子、一个可以随时使用的容器。你被搬动，被摆成别人需要的姿势，被打开，被合上。这中间有人送来过一次餐，餐盘放在你旁边的地毯上，没有人给你。你有名字，但没有一个人叫；你会说话，但没有一个人听。你只听见过一次自己的声音，是你在他抽屉开合的时候下意识说了一句"别"，那声音很轻，谁都没有反应。
第三天的凌晨，他兴致过去了，对你的存在感到了一点点麻烦，那种麻烦很像桌上多了一只用过的杯子。
"送下去，别脏了地毯。"
你被两个助理一左一右抬进了那部直达地下四层的货梯。电梯下行的时候，你听见他们在讨论周末去哪里。`,
  after:`他后来在自己的日程本上写：周三，清理。那两个字夹在"体检"和"见王总"之间，用的是同一支铅笔。`,
  struggle:{label:'在被抬走前咬住他的袖口', base:0.14, tag:'wit', ok:'spit_on_him', backup:'toy2'}});

D('toy2', {name:'清理', kind:'屈辱', tagline:'连挣扎都算作打扰',
  text:`你咬住了他的袖口。
布料在牙齿之间磨，很粗糙，带着一股熨过头的浆味。你咬得很紧，紧到牙龈开始发酸，牙关在抖，但你就是不松。
他终于低头看你。那一眼里没有怒意，甚至没有任何情绪，只有一点点轻微的厌烦，像看见一只弄脏了书页的虫。
他把袖子从你嘴里抽出来，抽得不快，你甚至听见布料从牙齿上刮过去的那一声。他抬起手腕，看了看那一小圈湿痕，看了看表，然后从内袋里抽出一方手帕。
他擦手，一根手指一根手指地擦，擦到第三根的时候停下来，把手帕随手扔下来。
白色的棉布正好盖在你的脸上。
手帕上是他香水的味道，一种很冷的木质调，混着一点纸和墨。你在那股味道里喘不上气，吸气的时候布料贴着鼻孔，被吸进去一点，又被呼出来的气顶开。
你的眼睛一直睁着，能看见白手帕上慢慢渗出一小片粉红——那是你的嘴唇，还在出血。
助理把你抬出去。货梯下行，楼层数字在门外一格一格跳，你听不见，你只听见盖子合上的声音。
然后是一声响，很小，像有人轻轻拍了一下手，然后拍完就忘了。`});

D('cargo', {name:'货', kind:'屈辱', tagline:'被装进冷冻车的第三层',
  text:`他们给你打了一针。针头很细，扎在颈侧，像被蚊子咬了一口，你甚至来得及扭头看了一眼那个打针的人。
你说不出话是从舌根开始的，然后是下颌，然后是整个口腔变成一块很沉的肉。手脚是接着不听的，最后是眼皮，眼皮垂到一半就不肯再往上抬了，你在那半开的视野里看着天花板往后退。
你被放进一个纸箱。箱子上印着某家酒业的字，箱里垫着一层泡沫，很软，软得让人想睡。有人在你身上盖了什么，很轻。
装卸的时候你醒过来大概半分多钟。这半分多钟是你这一晚最清醒的时候。
你在半分钟里知道了几件事：这是一辆冷链车，因为底盘一直在震，空气是冷的；箱子是叠起来的，你在第三层，上面压着两层，你听得见重物落上去时的闷响；右边的箱子里有东西在动，很轻，很规律，像指甲在刮纸板。
你还知道了一件事：你没有害怕，你只是很累。这大概是麻药的关系，但也不全是。
然后你又被黑暗收走了。
你最后被运去了哪里，没有记录。
"回廊"的档案里，你的名字后面写着两个字：失联。
在这套系统里，失联比死亡更干净——死亡要写报告，要有人签字，要有人问一句"她是怎么进去的"；失联只需要一个省略号。`,
  after:`那辆车在凌晨四点十七分通过了一个没有摄像头的路口。之后再没有人查过它的去向。`});

D('bid', {name:'落槌', kind:'屈辱', tagline:'第三十七号，起拍价',
  text:`你醒来的时候，手腕上有两个环。
环是皮革的，里面衬着软垫，扣得很专业——专业得让你知道，扣它的人扣过很多次，从来没有出过错。环上接着皮带，皮带拉紧，把两条手臂固定在一把椅子的两侧，椅子的坐垫是布的，很干净。
房间是红的。不是装修的红，是布的红，四壁垂着厚重的绒，连门帘都是。空气里有脂粉味、雪茄味，和一点点汗。
你身上那件风衣不见了，高领衫也不见了，鞋也被脱掉了。只剩下最里面的那一层，而那唯一的一层，是半透明的。
帘子被拉开。台下有二十几个人的脸，坐得很低，灯从台下打上来，把他们的下巴照得发亮，眼睛全在暗处，像一排没有情绪的洞。
"第三十七号。"台上的人说，声音很平，"十九到二十三之间，无病史，未开刃，起拍价不高——"
帘子又合上了。
你听见外面的人在加价，数字一个一个往上跳，跳得很快，中间夹着笑声和掌声。有人在数钱，纸币翻动的声音很清脆。
你把手腕往皮革上磨。你磨了整整四个小时，从左边磨到右边，磨破了自己，皮开了一道很长的口子，血把软垫浸黑了一小块。
皮带没有断。你也没有停。到后来你不再是为了挣脱，只是因为你不知道除了这件事还能做什么。`,
  struggle:{label:'把皮带扣咬下来', base:0.2, tag:'mobility', ok:'bid_break', backup:'bid2'}});

D('bid2', {name:'卖掉了', kind:'屈辱', tagline:'成交价不如一条好狗',
  text:`你咬到了皮带扣，牙齿崩了一小块，碎渣在舌头上硌着。
扣是铜的，边缘有倒刺。你的舌头被划开，血从嘴角流出来，顺着下巴滴在你自己的膝盖上，一小点一小点。
门开了。
进来的男人很高，穿一件熨得笔挺的浅灰西装，手里拿着一份文件，很薄，只有两页。他走到灯下，把文件翻开，看了看，又看你。
他看你的手腕，看你的嘴，看那截还沾着血的铜扣。
"有牙。"他说，回头对台上的人点了下头，"加价。"
外面的人又笑了一阵，笑声很松，像是听完了一个不错的小段子。
他把你从椅子上拎起来，动作不粗鲁，甚至因为太熟练而显得体贴——他先松开你左边的手环，再松右边，没有让皮带抽到你的脸。他扶着你的手肘，让你站稳，等你脚跟落了地才松开。
出门的时候，你最后回头看了一眼。红色的房间，红色的布，红色的灯。
帘子后面还有一个编号三十八的椅子，上面空着，坐垫上有一块很新鲜的压痕。`});

D('exposed', {name:'被看见的东西', kind:'屈辱', tagline:'你身上没有一处可以遮的',
  text:`他们是从设备层的拐角一起转出来的，两个人，一个拿手电，一个手里还端着一杯没喝完的茶。
手电的光先落在你的肩膀上，然后往下，一直落到脚背，再折回来，停在你脸上。光很稳，没有晃——这是训练过的反应，遇到不该出现的东西，第一件事是看清它，而不是喊。
他们两个都愣住了。那愣住的半秒，是今晚你唯一的机会，而你没有用上，因为你也在愣。
"……你从哪儿上来的？"
你没有回答。你身上已经没有可以回答这个问题的地方了。所有的布都在下面几层，留在楼梯、留在车库、留在某个已经记不清的转角。你站在那里，两手垂着，像一件被搬错了房间的家具。
拿茶的那一个先动了。他把杯子放在旁边的风柜上，放得很轻，像是怕惊到什么。
"叫人。"他说。
另一个人没有去叫人。他往前走了一步，又一步，走得很慢，绕着你，像在判断一件东西的成色。
你终于往后退。退到管壁上，背后是温的，机器在里面响。
他们交换了一个眼神。那个眼神你见过，在很多地方见过，那不是"怎么处理"的眼神，那是"谁先来"的眼神。
后面的事情，没有人在控制室里看见。那一排摄像头的线，上个月就被老鼠咬断了两根，一直没修。
四个小时以后，他们把你从设备层抬到货梯上。抬的方式很随便，一只手抓脚踝，一只手抓手腕，中间那段垂下去，在货梯的地板上拖着。
天亮之前，那辆清运车照例来了一趟。`,
  after:`那两个人后来都调走了，一个去了南区的仓库，一个回了老家。没有人问过他们那天晚上在三十九层做什么。`});

/* ================= 极刑类：楼里那些不讲道理的东西 ================= */
D('acid', {name:'清洁剂', kind:'极刑', tagline:'“生物酶”是一种很诚实的名字',
  text:`你被推进后厨的洗消间，门从外面插上了，插销是铁的，落进去的时候有两声。
地上有三个灰塑料桶，两个贴着"清水"的标签，第三个没有标签。你退了一步，脚跟撞在那个没标签的桶上。
桶倒了。液体泼在你的两截小腿上，顺着袜子和鞋面往里渗，三十秒之内没有任何感觉。你甚至松了口气，以为那真是水。
一分钟之后，你的小腿开始滑黏。
你低头看。皮肤在往下掉，不是被烧焦的那种黑，是像蜡一样，一块一块地软化、脱离、滑下去，底下露出来的东西是白的，湿的，亮得反光。你想把腿抬起来，抬到一半发现脚踝已经不听使唤了。
你尖叫，撞门。门是防火板，很厚，撞上去只有闷响。你把腿从桶边挪开，但液体已经浸透了裤脚，正顺着布料往上爬，爬过大腿，爬到膝盖，所到之处布料和皮肤一起发生了变化。
你用手去擦。手也开始滑黏。
四十分钟后，你蜷在洗消间的角落里，两条腿从膝盖往下只剩下一半，小臂上有几处已经能看到肌腱，它们随着你的呼吸一动一动，颜色比你想的要白。
你还活着。这才是最不公平的部分——化学伤不像刀伤，它不让你昏过去，它让你一直在这里。
保洁班长第二天早上开门，看到的是一个还在轻轻发抖的小东西。他后来辞职了，去了一个不需要进洗消间的岗位。`});

D('hook', {name:'挂钩', kind:'极刑', tagline:'冷库的滑轨，一匹马用的钩子',
  text:`挂钩原本是吊整只牛用的，单钩，两条轨道，一共四十米，挂在冷库的天花板下面。
他们把铁丝扣穿过你的手腕，绕了两圈，拧紧，然后把铁丝挂在钩子的第二格里。铁丝勒进皮肉的时候，你听见自己叫了一声，那声音在冷库里没有回声，被冻住了。
电机开始转。轨道上的滑轮发出很规律的咔嗒声。
你被吊起来。脚尖离地大约二十公分的时候，铁钩的尖端滑进了你的右侧肩胛下方，从腋窝深处顶出来——不，它没有穿出来，它卡在了肩胛骨和胸廓之间那一层很薄的间隙里，然后被你的体重压实。
你整个人的重量，从那一刻起，就靠这两块骨头承担。
你能听见自己的骨头在响。那种响声很细小，一粒一粒的，像有人在很近的地方嗑瓜子，很有耐心。
他们就这么把你吊着往前送，走了六米，停下来，说了几句话，又走。轨道上的灯是一格一格的，从你头顶一格一格地退过去。
你的影子落在地上，随着移动轻轻晃，晃得越来越慢。
大约十一分钟后，你的肩膀脱臼了，人往下坠了半个手掌。你没有掉下去，钩子还在，只是你更低了一点，脚尖几乎碰到地。
这时候他们才推来了那辆不锈钢的推车。推车的轮子有一个是坏的，一直响。`});

D('vise', {name:'液压平台', kind:'极刑', tagline:'车库里那台修车用的升降机',
  text:`他们把你平放在升降台上，脸朝上，然后在平台和上面的水泥梁之间垫了两块砖，留下大约十二公分的空隙。这个高度是量过的，不是随手垫的。
液压泵开始工作。那种声音很好听，低沉的、匀速的、像一台很健康的机器。
第一次压力上来的时候，你只是觉得闷，像被很厚的被子压着，胸口有点上不来气，但还能上。
第二次，你的肋骨从最下面两根开始断，断口向内，你能感觉到骨头断的时候那一下错位，很清脆，也很近。
第三次，你的骨盆发出一种很低的声音，不是"咔"，是"噗"，很闷，像一个装了水的袋子被踩到。
第四次的时候，你已经不是在呼吸了，你是在被呼吸——那两块东西在替你完成吸气呼气，你只是躺在里面，等着。

D('train', {name:'地铁', kind:'极刑', tagline:'撤离的最后一秒',

S.duel = {
  chapter:'五 · 交手',
  text:()=>{
    let t = `你拔刀的动作没有做完，他已经站起来了。
六十二岁的人，起身的时候扶手椅往后滑出去半米，地毯上发出一声很闷的摩擦。他手里那本册子掉在地上，摊开，照片朝上。他站得很直，两只手垂在体侧，没有抬起来护胸——这是受过训练的人才有的姿势，普通人第一反应一定是抱头。
你的第一刀刺向他的喉侧。他动了，动得很小：身体侧转十公分，左小臂横过来。刀刃在他小臂外侧划开一道，血立刻从袖子里渗出来，把深色的花呢洇成一块更深的黑。但他同时抓住了你的手腕。

他推开你。你退了三步，后腰撞在书桌边缘，撞在髋骨上，那一下很实，疼得你眼前发白，有一瞬间站不直。

    if(s.flags.duelWounded) t += `\n\n<span class="warn">你的右肋从刚才撞上桌角起就一直在钝痛，吸气的时候尤其明显。大概是骨裂。这具身体你用了二十四年，从来没有像今晚这样，觉得它这么不经用。</span>`;
    if(isBare('shoes') || isBare('socks')) t += `\n\n<span class="warn">你脚下什么也没有，地毯的绒毛直接蹭着脚心。刚才退那三步的时候，你的脚趾在地上抓紧了一下才站住——如果穿着那双软底靴，你不会撞上桌角。</span>`;

    return t;
  },

    if(s.flags.spared) s2 += `\n\n<span class="cool">你放过了他。这在你们的行当里有一个专门的说法，叫"失手"。但你自己知道那不是失手——失手是运气，放过一个人是选择，而你已经很久没有自己做过选择了。</span>`;
    if(s.flags.killedChef) s2 += `\n\n<span class="warn">你想起电梯里那个女厨工的手。她的手指很粗，指甲剪得很短。你后来一直没敢再想她的脸。</span>`;
    if(bareCount() >= 3) s2 += `\n\n<span class="warn">你脱下来的那堆东西里，其实没有几件。你今晚几乎是空着身子穿过那栋楼的——这件事你以后会想很多次，想它到底是怎么成功的。</span>`;
    s2 += `\n\n<em>通关。死法收集 ${c.length} / ${Object.keys(DEATHS).length}。换一身衣服，就是另一条命。</em>`;
    return s2;
  },
  choices:[
    {label:'翻一翻死法图鉴', natime:true, act(){ openCodex(); }},
    {label:'从头开始，换一条路', natime:true, act(){ newGame(); }},
    {label:'回到白鲸塔外面，再走一次', cls:'jade', natime:true,
      act(){ s.t = T0; s.hp = Math.min(100,s.hp+40); s.susp = 0; s.alarm = 0; go('outer'); }},
  ]
};

/* ==================================================================== */
/* 挣扎脱身：所有“最后一搏”成功后的共同出口                              */
/* ==================================================================== */
function escScene(id, chapter, text, opts){
  opts = opts || {};
  S[id] = {
    chapter: chapter,
    text: text,
    choices: [
      { label: opts.a || '带着伤，继续往上', cls:'gold', time:6,
        act(){
          s.hp = clamp(s.hp - (opts.cost||40), 6, 100);
          s.susp += 20; s.alarm += 1;
          flash('你活着出来了。但代价很大。');
          go(opts.next || 'floor43');
        }},
      { label: opts.b || '从楼里退出去。今晚到此为止', time:8,
        act(){ s.hp = clamp(s.hp - (opts.cost||40), 6, 100); s.flags.withdrew = true; go('retreat'); }},
    ]
  };
}

D('drain', {name:'管沟', kind:'意外', tagline:'水涨上来的时候，你正卡在管子里',

你能呼吸，是因为你贴着那个五公分的空腔。水每涨一厘米，你能呼吸的空气就少一点，那五公分就变成四公分、三公分，变成一条缝。

D('duct_crush', {name:'管道', kind:'意外', tagline:'风阀在你身后启动了',

D('burn', {name:'火', kind:'意外', tagline:'四十层的变电室',

/* ------------------------------------------------------------------ */
/* 状态                                                                */
/* ------------------------------------------------------------------ */
const T0 = 23*60 + 40;      // 23:40
const T_END = 26*60;        // 02:00 换班
const SAVE_KEY = 'ying.whaletower.save.v1';
const CODEX_KEY= 'ying.whaletower.codex.v1';

let s = null;               // 当前状态
let cp = null;              // 场景检查点
let lastCheckpointName = '';

function fresh(){
  return {
    scene:'brief',
    hp:100, expo:0, susp:0, alarm:0, t:T0,
    worn:{outer:'trench', top:'turtleneck', bottom:'trousers', underwear:'plain', socks:'nylon', shoes:'boots', tool:'blade'},
    bag:['lockpick','lipstick'],
    flags:{},
    log:[],
    lost:[],
    deaths:[],
    attempts:0,
    wardrobeOpen:false,
    pickSlot:null
  };
}

/* ------------------------------------------------------------------ */
/* 装备逻辑                                                            */
/* ------------------------------------------------------------------ */
function item(id){ return WEAR[id]; }
function wornIds(){ return SLOT_ORDER.map(k=>s.worn[k]).filter(Boolean); }
function wornItems(){ return wornIds().map(id=>WEAR[id]).filter(Boolean); }

const STAT_KEYS = ['stealth','mobility','armor','charm','look'];
function statSum(){
  const o = {stealth:0,mobility:0,armor:0,charm:0,look:0,expo:0};
  wornItems().forEach(it=>{
    STAT_KEYS.forEach(k=>{ o[k] += (it[k]||0); });
    o.expo += (it.expo||0);
  });
  return o;
}
function totalExpo(){
  // 服装自带暴露 + 状态累加
  return clamp(Math.round(statSum().expo + s.expo), 0, 100);
}

/* ---- 标签系统：衣服不只是数值，某些判定只认"你穿了什么" ---- */
function hasTag(t){
  return wornItems().some(it => (it.tags || []).includes(t));
}
function countTag(t){
  return wornItems().filter(it => (it.tags || []).includes(t)).length;
}
function isBare(slot){ return !s.worn[slot]; }
function bareCount(){
  return SLOT_ORDER.filter(k => k !== 'tool' && !s.worn[k]).length;
}
function tagNames(){
  const set = new Set();
  wornItems().forEach(it => (it.tags || []).forEach(t => set.add(t)));
  return [...set];
}
function doff(slot){
  const id = s.worn[slot];
  if(!id) return false;
  s.worn[slot] = null;
  const it = WEAR[id];
  log(`脱下：${it.name}`);
  tick(1);
  if(it.onRemove) it.onRemove();
  return true;
}
function don(slot, id){
  const it = WEAR[id];
  if(!it || it.slot !== slot) return false;
  if(s.worn[slot]) {
    // 换下旧的；只有"楼里拿到的"那一类才进随身包，常备衣物放回衣箱
    const old = WEAR[s.worn[slot]];
    if(SCENE_GEAR.has(old.id)) s.bag.push(old.id);
    if(old.onRemove) old.onRemove();
  }
  const i = s.bag.indexOf(id);
  if(i>=0) s.bag.splice(i,1);
  s.worn[slot] = id;
  log(`换上：${it.name}`);
  tick(1);
  if(it.onWear) it.onWear();
  return true;
}
function has(id){ return wornIds().includes(id); }
function bagHas(id){ return s.bag.includes(id); }

/* ------------------------------------------------------------------ */
/* 时间 / 警报                                                         */
/* ------------------------------------------------------------------ */
function tick(min){
  s.t += min;
  if(s.t >= T_END && !s.flags.timedOut){
    s.flags.timedOut = true;
    s.alarm += 2;
    s.susp += 20;
  } else if(s.t >= T_END - 15 && !s.flags.warned){
    s.flags.warned = true;
  }
}
function clockStr(){
  const t = s.t % 1440;
  const h = String(Math.floor(t/60)).padStart(2,'0');
  const m = String(t%60).padStart(2,'0');
  return h+':'+m;
}
function alarmLabel(){
  if(s.alarm<=0) return '常态';
  if(s.alarm===1) return '留意';
  if(s.alarm===2) return '搜楼';
  if(s.alarm===3) return '封锁';
  return '猎杀';
}
function alarmMod(){ return s.alarm * 0.07; }

/* ------------------------------------------------------------------ */
/* 判定                                                                */
/* ------------------------------------------------------------------ */
/*
  test 结构：
  { tag:'stealth', base:0.62, label:'潜行', ok:'sceneId或函数', bad:'sceneId或函数',
    bonus:{after:0.1}, expoHelp:true, expoHurt:false, hard:true }
*/
function computeOdds(t){
  const st = statSum();
  let p = t.base != null ? t.base : 0.6;
  const tag = t.tag || 'stealth';

  if(tag==='stealth'){
    p += st.stealth * 0.011;
    p -= totalExpo() * 0.0042;      // 太显眼，潜行变难
    p -= s.susp * 0.0026;
  } else if(tag==='mobility'){
    p += st.mobility * 0.012;
    p -= (100-s.hp) * 0.0013;       // 受伤拖慢
  } else if(tag==='charm'){
    p += st.charm * 0.013;
    p += totalExpo() * 0.0035;      // 露得多，谈得开
    p -= s.susp * 0.0030;
  } else if(tag==='force'){
    p += st.armor * 0.008;
    p += (s.hp - 60) * 0.0035;
  } else if(tag==='wit'){
    p += 0.0;
    p -= s.susp * 0.002;
  }
  if(t.bonus) for(const k in t.bonus) p += t.bonus[k];
  // 标签修正：衣服的"特殊效果"在这里生效
  if(t.tagBonus) for(const k in t.tagBonus) p += countTag(k) * t.tagBonus[k];
  if(t.needTag && !hasTag(t.needTag)) p -= 0.18;
  if(t.bareBonus) p += bareCount() * t.bareBonus;
  if(t.bareSlot && isBare(t.bareSlot)) p += (t.bareSlotBonus || 0.15);
  if(t.hard) p -= 0.12;
  p -= alarmMod();
  return clamp(p, 0.12, 0.94);
}
function roll(t, okId, badId){
  const p = computeOdds(t);
  const win = Math.random() < p;
  const pct = Math.round(p*100);
  if(win){ if(okId) go(okId); return true; }
  else { if(badId) go(badId); return false; }
}
function oddsText(t){
  const p = Math.round(computeOdds(t)*100);
  let cls = 'ok', word = '稳';
  if(p<35){ cls='bad'; word='凶'; }
  else if(p<60){ cls='risk'; word='险'; }
  return `<span class="${cls}">[${t.label||'判定'} ${p}% · ${word}]</span>`;
}

/* ------------------------------------------------------------------ */
/* 死亡                                                                */
/* ------------------------------------------------------------------ */
function unlockDeath(id){
  const c = loadCodex();
  if(!c.includes(id)){ c.push(id); saveCodex(c); }
}
function loadCodex(){ try{ return JSON.parse(localStorage.getItem(CODEX_KEY)) || []; }catch(e){ return []; } }
function saveCodex(c){ try{ localStorage.setItem(CODEX_KEY, JSON.stringify(c)); }catch(e){} }

function autopsyHTML(r){
  const rows = [
    ['死亡时间', r.time],
    ['发现地点', r.place],
    ['衣着遗物', r.dress],
    ['体表所见', r.surface],
    ['内部损伤', r.inner],
    ['鉴定意见', r.opinion],
    ['死因判定', r.cause, 'cause'],
    ['现场勘验', r.note],
  ].filter(x => x[1]);
  if(!rows.length) return '';
  return `<div class="autopsy"><h4>法医检验报告${r.no?'　编号 '+r.no:''}</h4><dl>` +
    rows.map(([k,v,cls]) => `<dt>${k}</dt><dd class="${cls||''}">${v}</dd>`).join('') +
    `</dl></div>`;
}

/* 尸体被发现时的衣着状态——按你当时真正穿在身上的东西生成 */
function dressReport(){
  const w = s.worn;
  const seg = [];
  if(w.outer) seg.push(`外着${WEAR[w.outer].name}一件`);
  else seg.push('躯干外层无衣物');
  if(w.top) seg.push(`${w.outer?'内着':'上身唯一覆盖物为'}${WEAR[w.top].name}`);
  else seg.push('上身无衣物覆盖');
  if(w.bottom) seg.push(`下着${WEAR[w.bottom].name}`);
  else seg.push('下身无衣物覆盖');
  seg.push(w.underwear ? WEAR[w.underwear].name : '未着内衣');
  seg.push(w.socks ? `双足着${WEAR[w.socks].name}` : '双足未着袜');
  seg.push(w.shoes ? `足穿${WEAR[w.shoes].name}` : '双足赤裸');
  let line = seg.join('，') + '。';
  const bg = bareCount();
  if(bg >= 3) line += '体表大部分区域直接暴露于环境，裸露部位见附着性污渍与多处擦伤，与时令及场所的常规着装不符。';
  else if(totalExpo() >= 60) line += '衣着明显不整，多处接缝撕裂，纽扣缺失，符合遭受外力牵拉所致。';
  if((s.lost||[]).length) line += '现场及沿途另拣取散落衣物：' + s.lost.map(x=>WEAR[x]?WEAR[x].name:x).join('、') + '。';
  if(s.bag && s.bag.length) line += '随身物品：' + s.bag.map(x=>WEAR[x]?WEAR[x].name:x).join('、') + '。';
  else line += '随身未见物品。';
  return line;
}

/* 衣物在打斗、拖拽中脱落或被强行剥去 */
function loseGear(slot, msg){
  const id = s.worn[slot];
  if(!id) return false;
  const it = WEAR[id];
  s.worn[slot] = null;
  s.lost = s.lost || [];
  s.lost.push(id);
  log('失去：' + it.name);
  if(msg) flash(msg);
  return true;
}

/* 死亡发生时，身上的每一件东西都留下自己的痕迹 */
function dressTail(){
  const w = s.worn, out = [];
  if(!w.shoes) out.push('你到最后都是光着脚的。脚底一直贴着地，凉，这个感觉到最后都没有断。');
  else if(w.shoes === 'heels') out.push('右脚的鞋跟断了，斜插在地毯里，离你大概一米，孤零零地立着。');
  else if(w.shoes === 'boots') out.push('那双软底靴还穿在脚上，鞋底几乎没沾到血——它本来是为了让你走路不出声的。');
  else if(w.shoes === 'sneakers') out.push('跑鞋的鞋带还是两个死结，没有人解开过。');

  if(w.outer === 'gown') out.push('墨绿的裙子浸了血，颜色变深，摊在身下像一小片没有光的湖。');
  else if(w.outer === 'trench') out.push('风衣的下摆压在你身下，遮住了一半的伤。这件衣服跟了你三年。');
  else if(w.outer === 'guard_jacket') out.push('那件藏青外套太大，肩线落到了你的肘上，袖口还留着别人的体温。');
  else if(!w.outer) out.push('你身上没有外层。别人一眼就能把你从头看到脚。');

  if(w.underwear === 'lace') out.push('蕾丝那一层被血浸硬了，边缘翘起一圈很细的毛边。');
  else if(!w.underwear) out.push('你身上没有一处可以遮的。第一个发现你的人后来说，他起先以为那是一堆被扔掉的旧衣服。');

  if(w.socks === 'stocking') out.push('吊带松了一根，长筒袜滑到膝盖以下，堆在脚踝上。');
  else if(w.socks === 'nylon') out.push('丝袜在右膝那里勾破了一道，破口从膝上一直裂到脚踝。');
  else if(!w.socks) out.push('袜子那一层是空的。你的脚踝在灯下露着，很白。');

  if(w.tool === 'blade') out.push('刀还在你手边，只是刃口朝向了你自己。');
  else if(!w.tool) out.push('你身上一件工具也没有留下。他们搜得很干净。');

  return out.length ? '\n\n' + out.join('') : '';
}

function die(id, extra){
  const d = DEATHS[id];
  if(!d){ console.warn('missing death', id); return; }
  s.lastDeath = id;
  unlockDeath(id);
  s.attempts++;
  const rep = d.report ? Object.assign({}, d.report) : null;
  if(rep) rep.dress = dressReport();
  S.__death = () => ({
    kind:'death',
    chapter:'死',
    name:d.name,
    tagline: d.tagline,
    kindName: d.kind,
    report: rep,
    text: d.text + dressTail() + (extra ? '\n\n'+extra : ''),
    choices: d.struggle ? [
      { label: d.struggle.label, hint:'最后一搏 · '+Math.round(d.struggle.base*100)+'%', cls:'gold',
        test:{ tag:d.struggle.tag||'mobility', base:d.struggle.base, label:'挣扎', hard:true },
        to: d.struggle.ok, death:true, act(){
          if(!roll(d.struggle, d.struggle.ok, null)){
            const id2 = d.struggle.backup || id;
            setTimeout(()=>die(id2), 0);
          }
        }},
      { label:'不再动了', hint:'接受这个结局', act(){ go('__death_hold'); } }
    ] : [
      { label:'不再动了', hint:'接受这个结局', act(){ go('__death_hold'); } }
    ]
  });
  S.__death_hold = () => ({
    kind:'hold', chapter:'收官',
    text: d.after || '雨还在下。这座城市不会为任何人停一秒。\n\n白鲸塔的灯依旧亮着，四十七层，一格一格，像一副收好的牙。',
    choices:[
      { label:'回到上一个落脚点', hint: cp ? ('从「'+lastCheckpointName+'」重来') : '从开场重来', cls:'jade', act(){ if(cp){ s = JSON.parse(JSON.stringify(cp)); render(); } else { newGame(); } } },
      { label:'从头开始', hint:'换一身衣服，换一条路', act(){ newGame(); } },
      { label:'翻一翻死法图鉴', act(){ openCodex('death'); } }
    ]
  });
  s.scene = '__death';
  render();
}

/* 存档 / 检查点                                                       */

function checkpoint(name){
  cp = JSON.parse(JSON.stringify(s));
  lastCheckpointName = name;
}
function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({s, cp, lastCheckpointName, at:Date.now()})); }catch(e){}
}
function loadGame(){
  try{ const o = JSON.parse(localStorage.getItem(SAVE_KEY)); if(o&&o.s){ s=o.s; cp=o.cp; lastCheckpointName=o.lastCheckpointName||''; return true; } }catch(e){}
  return false;
}
function log(x){ s.log.push(x); if(s.log.length>160) s.log.shift(); }

/* 渲染                                                                */
/* ------------------------------------------------------------------ */
function newGame(){
  s = fresh();
  cp = null; lastCheckpointName='';
  render();
}

function updateHUD(){
  const ex = totalExpo();
  $('#hpv').textContent = Math.max(0, Math.round(s.hp));
  $('#hpbar').style.width = clamp(s.hp,0,100)+'%';
  $('#exv').textContent = ex;
  $('#exbar').style.width = ex+'%';
  $('#exv').style.color = ex>=70 ? 'var(--blood2)' : (ex>=45?'var(--gold)':'');
  $('#suv').textContent = Math.round(s.susp);
  $('#subar').style.width = clamp(s.susp,0,100)+'%';
  $('#clk').textContent = clockStr();
  $('#alv').textContent = alarmLabel();
  const aw = $('#alarmwrap');
  $('#alv').className = s.alarm>=2 ? 'alarm-on' : '';
}

function renderWardrobe(){
  const box = $('#slots');
  box.innerHTML = '';
  SLOT_ORDER.forEach(k=>{
    const id = s.worn[k];
    const it = id ? WEAR[id] : null;
    const d = document.createElement('div');
    d.className = 'slot';
    const tip = it
      ? ((it.perk ? '效果：' + it.perk + '　' : '') + (it.draw && it.draw !== '无' ? '代价：' + it.draw : ''))
      : '';
    d.innerHTML = `<span class="k">${SLOT_NAMES[k]}</span>
      <span class="v ${it?'':'empty'}" title="${tip}">${it?it.name:'（未穿）'}</span>
      ${it?`<button class="rm" data-doff="${k}" title="脱下${it.name}">脱下</button>`:''}`;
    box.appendChild(d);
  });
  box.querySelectorAll('[data-doff]').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.doff;
      const it = WEAR[s.worn[k]];
      if(it && it.sealed && !it.canRemove()) { flash('这件脱不下来。'); return; }
      doff(k); renderWardrobe(); updateHUD();
    };
  });

  const st = statSum();
  const ex = totalExpo();
  const bg = bareCount();
  $('#statline').innerHTML =
    `隐匿 <b>${st.stealth>=0?'+':''}${st.stealth}</b>　机动 <b>${st.mobility>=0?'+':''}${st.mobility}</b><br>` +
    `防护 <b>${st.armor>=0?'+':''}${st.armor}</b>　魅力 <b>${st.charm>=0?'+':''}${st.charm}</b><br>` +
    `注目 <b style="color:${ex>=70?'var(--blood2)':ex>=45?'var(--gold)':'var(--jade)'}">${ex}</b>` +
    (bg ? `　暴露部位 <b style="color:var(--blood2)">${bg}</b>` : '') +
    (tagNames().length ? `<br>特性 <b>${tagNames().join(' · ')}</b>` : '');
  $('#stripAll').disabled = !canWardrobe();

  $('#bag').textContent = s.bag.length ? s.bag.map(x=>'· '+(WEAR[x]?WEAR[x].name:x)).join('\n') : '（空）';
  $('#btnWardrobe').disabled = !canWardrobe();
}

/* 全部脱下：只留下随身的东西 */
function stripAll(){
  if(!canWardrobe()){ flash('这个时候脱不了。'); return; }
  let n = 0;
  ['outer','top','bottom','underwear','socks','shoes'].forEach(k=>{
    if(s.worn[k]){ doff(k); n++; }
  });
  if(!n) flash('本来就没穿什么了。');
  else flash('你把身上所有的布都留在了原地。');
  renderWardrobe(); updateHUD();
}

function canWardrobe(){
  const sc = S[s.scene];
  if(!sc) return true;
  const out = (typeof sc==='function') ? null : sc;
  if(s.scene.startsWith('__')) return false;
  return !sc || sc.allowWardrobe !== false;
}

function flash(msg){
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText='position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(179,39,43,.92);color:#fff;padding:10px 22px;border-radius:2px;z-index:300;font-size:14px;letter-spacing:.06em;font-family:ui-monospace,monospace';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .4s';el.style.opacity='0';},900);
  setTimeout(()=>el.remove(),1400);
}

let _lockScroll = false;
function render(){
  const startScene = s.scene;
  const raw = S[startScene];
  if(!raw){ console.error('no scene', s.scene); return; }
  const sc = (typeof raw === 'function') ? raw() : raw;
  if(s.scene !== startScene) return;   // 求值过程中场景已被改写（例如池化死亡），交给新的渲染

  // text 可以是字符串，也可以是函数（随状态变化的那几幕）
  let body = sc.text;
  if(typeof body === 'function') body = body();
  if(s.scene !== startScene) return;

  $('#chapter').textContent = sc.chapter || '白鲸塔';

  const story = $('#story');
  const deathClass = sc.kind==='death' ? 'death' : '';
  const paras = String(body == null ? '' : body).split('\n').filter(l=>l!=='');;
  if(sc.kind==='death'){
    story.innerHTML = '';
    const d = document.createElement('div');
    d.className='death';
    d.innerHTML = `<h2>${sc.name||'终'}</h2>
      ${sc.tagline?`<div class="tagline">${sc.tagline}</div>`:''}
      <div class="prose">${paras.map(p=>`<p>${p}</p>`).join('')}</div>
      ${sc.report?autopsyHTML(sc.report):''}
      <div class="meta">死因归类 ${sc.kindName||'未分类'}　·　${clockStr()}　·　第 ${s.attempts} 次尝试　·　已收集死法 ${loadCodex().length} / ${Object.keys(DEATHS).length}</div>`;
    story.appendChild(d);
  } else {
    story.innerHTML = paras.map(p=>`<p class="${p.startsWith('　')?'':'na'}">${p}</p>`).join('');
  }

  const cbox = $('#choices');
  cbox.innerHTML = '';
  (sc.choices||[]).forEach((c)=>{
    if(c.show && !c.show()) return;
    const b = document.createElement('button');
    b.className = 'choice ' + (c.cls||'');
    let h = '';
    if(c.test) h += oddsText(c.test) + '　';
    if(c.hint) h += (typeof c.hint === 'function' ? c.hint() : c.hint);
    b.innerHTML = '<span>'+c.label+'</span>' + (h ? '<span class="hint">'+h+'</span>' : '');
    b.onclick = ()=>{ choose(c); };
    cbox.appendChild(b);
  });

  updateHUD();
  renderWardrobe();
  saveGame();
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(c){
  if(!c.natime) tick(c.time || 3);
  if(c.act){ c.act(); return; }
  if(c.test){ roll(c.test, c.test.ok || c.to, c.test.bad); return; }
  if(c.to){ go(c.to); return; }
}

function go(id){
  if(DEATHS[id]){ die(id); return; }        // 失败直通某一死法
  if(!S[id]){ console.error('missing scene', id); return; }
  s.scene = id;
  render();
}

/* 只能"在楼里拿到"才能穿的装备；其余都是安全屋衣箱里的常备品 */
const SCENE_GEAR = new Set(['guard_jacket','apron','towel','lab_coat','host_dress']);

function openWardrobe(){
  if(!canWardrobe()){ flash('这个时候顾不上换衣服。'); return; }
  const m = $('#modal');
  $('#mtitle').textContent = '调整着装';
  $('#msub').textContent = '换下的衣物会进入随身包。有些地方穿得少是优势，有些地方是死因。';
  $('#mtabs').innerHTML = '';
  const body = $('#mbody');
  body.innerHTML = '';
  SLOT_ORDER.forEach(k=>{
    const wornId = s.worn[k];
    const bar = document.createElement('div');
    bar.className = 'wbar';
    const lab = document.createElement('span');
    lab.className = 'chapter';
    lab.style.cssText = 'margin:0;flex:1';
    lab.textContent = SLOT_NAMES[k];
    bar.appendChild(lab);
    if(wornId){
      const b = document.createElement('button');
      b.className = 'rm';
      b.textContent = '脱下 ' + WEAR[wornId].name;
      b.onclick = ()=>{ doff(k); openWardrobe(); updateHUD(); };
      bar.appendChild(b);
    }
    body.appendChild(bar);
    const list = document.createElement('div');
    list.className='picklist';
    const candidates = Object.values(WEAR).filter(it=>it.slot===k &&
      (s.worn[k]===it.id || bagHas(it.id) || !SCENE_GEAR.has(it.id)));
    if(!candidates.length){
      const p = document.createElement('div');
      p.className='codebox'; p.textContent='（没有可换的）';
      list.appendChild(p);
    }
    candidates.forEach(it=>{
      const b = document.createElement('button');
      b.className = 'pick ' + (s.worn[k]===it.id?'own':'');
      b.innerHTML = `<span>${it.name}${s.worn[k]===it.id?' · 在身':''}</span>
        <small>隐匿 ${it.stealth>=0?'+':''}${it.stealth} ／ 机动 ${it.mobility>=0?'+':''}${it.mobility} ／ 防护 ${it.armor>=0?'+':''}${it.armor} ／ 魅力 ${it.charm>=0?'+':''}${it.charm} ／ 注目 ${it.expo>=0?'+':''}${it.expo}</small>
        ${it.perk?`<span class="perk">效果：${it.perk}</span>`:''}
        ${it.draw && it.draw!=='无'?`<span class="draw">代价：${it.draw}</span>`:''}
        <small style="color:#5f6672">${it.desc||''}</small>`;
      b.onclick = ()=>{ don(k, it.id); openWardrobe(); updateHUD(); };
      list.appendChild(b);
    });
    body.appendChild(list);
  });
  m.classList.add('on');
}

/* ------------------------------------------------------------------ */
/* 图鉴                                                                */
/* ------------------------------------------------------------------ */
let codexTab = 'death';
function openCodex(tab){
  codexTab = tab || codexTab;
  const c = loadCodex();
  const m = $('#modal');
  $('#mtitle').textContent = '死法图鉴';
  $('#msub').textContent = `已收集 ${c.length} / ${Object.keys(DEATHS).length}　—　失败是这出戏的主要台词。`;
  const tabs = $('#mtabs');
  tabs.innerHTML = '';
  const groups = {};
  Object.entries(DEATHS).forEach(([id,d])=>{
    const g = d.kind || '其他';
    (groups[g] = groups[g]||[]).push([id,d]);
  });
  const keys = ['全部', ...Object.keys(groups)];
  keys.forEach(k=>{
    const b = document.createElement('button');
    b.textContent = k;
    b.className = (codexTab===k?'on':'');
    b.onclick = ()=>{ codexTab = k; openCodex(k); };
    tabs.appendChild(b);
  });

  const body = $('#mbody');
  body.innerHTML = '';
  const grid = document.createElement('div');
  grid.className='grid';
  let n=0;
  Object.entries(DEATHS).forEach(([id,d])=>{
    if(codexTab!=='全部' && (d.kind||'其他')!==codexTab) return;
    n++;
    const got = c.includes(id);
    const e = document.createElement('div');
    e.className = 'ent ' + (got?'got':'locked');
    e.innerHTML = got
      ? `<b>${d.name}</b><small>${d.kind||''} · ${d.tagline||''}</small>`
      : `<b>？？？</b><small>${d.kind||''} · 未遭遇</small>`;
    grid.appendChild(e);
  });
  body.appendChild(grid);
  if(!n) body.innerHTML = '<div class="codebox">这一类还没有内容。</div>';
  m.classList.add('on');
}

/* ------------------------------------------------------------------ */
/* 绑定                                                                */
/* ------------------------------------------------------------------ */
window.addEventListener('DOMContentLoaded', ()=>{
  $('#btnCodex').onclick = ()=>openCodex();
  $('#btnGear').onclick = ()=>openWardrobe();
  $('#btnWardrobe').onclick = ()=>openWardrobe();
  $('#stripAll').onclick = ()=>stripAll();
  $('#btnRestart').onclick = ()=>{
    if(confirm('放弃当前进度，从白鲸塔外重新开始？')) newGame();
  };
  $('#mclose').onclick = ()=>$('#modal').classList.remove('on');
  $('#modal').onclick = e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on'); };
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('#modal').classList.remove('on'); });
  if(!loadGame()) newGame();
  else { render(); }
});
